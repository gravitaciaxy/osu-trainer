<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>osu!drill</title>
<meta name="description" content="Pick osu! maps by skill, by similarity to maps you like, the most popular songs among fans of a skill or real tournament pools, and get a ready osu!lazer collection">
<style>
  :root{
    --bg:#161214; --panel:#221b1f; --panel2:#2c2328; --line:#3b2f36; --line2:#4a3b44;
    --text:#f3eaef; --dim:#ab99a2; --faint:#7d6c75;
    --accent:#ff66aa; --accent-ink:#2a0d1b; --accent2:#66ccff; --ok:#7ddf90; --warn:#ffcc66; --err:#ff8a8a;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;flex-direction:column}
  button,input,textarea{font:inherit;color:inherit}
  a{color:var(--accent2);text-decoration:none}
  a:hover{text-decoration:underline}
  [hidden]{display:none !important}

  header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--panel);
         border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;letter-spacing:.3px;white-space:nowrap}
  header h1 b{color:var(--accent)}
  header h1 small{color:var(--faint);font-size:11px;font-weight:400;margin-left:6px}
  header .info{color:var(--dim);font-size:12px;flex:1;min-width:160px}
  .hbtns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .seg{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
  .seg button{background:none;border:0;padding:5px 10px;color:var(--dim);cursor:pointer;font-size:12px}
  .seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
  .iconbtn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:5px 10px;
           cursor:pointer;color:var(--text);font-size:12px;white-space:nowrap}
  .iconbtn:hover{border-color:var(--accent)}
  .iconbtn.dot{position:relative}
  .iconbtn.dot::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}

  .banner{margin:12px 16px 0;padding:10px 14px;border-radius:var(--radius);border:1px solid #6b4a1f;
          background:#2d2216;color:var(--warn);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .banner.err{border-color:#6b2a2a;background:#2d1818;color:var(--err)}
  .banner.info{border-color:#28465a;background:#152129;color:#cfe9f7}
  .banner span{flex:1;min-width:200px}

  main{display:grid;grid-template-columns:minmax(380px,500px) minmax(0,1fr);gap:16px;padding:16px;
       align-items:start;flex:1;width:100%;max-width:1500px;margin:0 auto}
  @media (max-width:980px){ main{grid-template-columns:minmax(0,1fr)} }
  @media (max-width:520px){ main{padding:10px;gap:10px} header{padding:10px 12px} }

  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px}
  .card h2{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);
           display:flex;align-items:center;gap:6px;font-weight:600;flex-wrap:wrap}
  .card h2 .sub{text-transform:none;letter-spacing:0;color:var(--faint);font-weight:400}
  .sticky{position:sticky;top:72px}
  @media (max-width:980px){ .sticky{position:static} }

  .tabs{display:flex;gap:6px;margin-bottom:6px}
  .tabs button{flex:1;padding:9px;border:1px solid var(--line2);background:var(--panel2);color:var(--dim);
               border-radius:8px;cursor:pointer;font-size:13px}
  .tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

  .lbl{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);margin:12px 0 5px}
  .lbl .val{margin-left:auto;color:var(--text);font-variant-numeric:tabular-nums;font-size:12px}
  .help{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;
        border:1px solid var(--line2);color:var(--faint);font-size:10px;font-weight:700;cursor:help;flex:none;user-select:none}
  .help:hover,.help:focus{border-color:var(--accent);color:var(--accent);outline:none}
  input[type=text],input[type=number],textarea{width:100%;min-width:0;padding:7px 9px;background:var(--panel2);
        border:1px solid var(--line2);border-radius:7px;color:var(--text);font-size:13px}
  input::placeholder,textarea::placeholder{color:var(--faint)}
  textarea{min-height:58px;resize:vertical;line-height:1.4}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  .row{display:flex;gap:10px}
  .row>*{flex:1;min-width:0}
  @media (max-width:420px){ .row.wrap{flex-wrap:wrap} .row.wrap>*{flex:1 1 45%} }

  /* двусторонний ползунок */
  .range{position:relative;height:26px;margin:0 8px}
  .range .track{position:absolute;left:0;right:0;top:11px;height:4px;border-radius:2px;background:var(--line2)}
  .range .fill{position:absolute;top:11px;height:4px;border-radius:2px;background:var(--accent)}
  .range input[type=range]{position:absolute;left:-8px;width:calc(100% + 16px);top:0;height:26px;margin:0;
        background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
  .range input[type=range]::-webkit-slider-runnable-track{background:none;height:26px}
  .range input[type=range]::-moz-range-track{background:none;height:26px}
  .range input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;pointer-events:auto;width:16px;height:16px;
        margin-top:5px;border-radius:50%;background:var(--text);border:3px solid var(--accent);cursor:grab}
  .range input[type=range]::-moz-range-thumb{pointer-events:auto;width:12px;height:12px;border-radius:50%;
        background:var(--text);border:3px solid var(--accent);cursor:grab}
  .range input[type=range]:focus{outline:none}
  .range input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 3px #ff66aa55}
  .range input[type=range]:focus-visible::-moz-range-thumb{box-shadow:0 0 0 3px #ff66aa55}

  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{padding:5px 10px;border:1px solid var(--line2);border-radius:20px;background:var(--panel2);
        color:var(--dim);cursor:pointer;font-size:12px;user-select:none;line-height:1.3}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .chip small{opacity:.65;margin-left:4px;font-weight:400}
  .slotgrid{display:flex;flex-direction:column;gap:6px}
  .slotrow{display:flex;gap:6px;align-items:flex-start}
  .slotrow .mod{width:34px;flex:none;padding:5px 0;color:var(--dim);font-weight:700;font-size:12px;cursor:pointer;
                border:0;background:none;text-align:left}
  .slotrow .mod:hover{color:var(--accent)}
  .slotrow .chips{flex:1}

  .flags{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px}
  .flag{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}
  .flag input{accent-color:var(--accent);margin:0}

  details{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
  details summary{cursor:pointer;color:var(--dim);font-size:12px;user-select:none}
  details summary:hover{color:var(--text)}

  .block{margin:14px 0 0;background:var(--panel2);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
  .block h3{margin:0;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);font-weight:600}
  .block input[type=text],.block input[type=number]{background:var(--panel)}
  .actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .btn{padding:10px 14px;border-radius:8px;cursor:pointer;font-size:13px;border:1px solid var(--line2);
       background:var(--panel);color:var(--text)}
  .btn:hover:not(:disabled){border-color:var(--accent)}
  .btn.go{flex:2 1 160px;border:none;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px}
  .btn.alt{flex:1 1 110px}
  .btn.small{padding:6px 10px;font-size:12px;flex:none}
  .btn:disabled{opacity:.45;cursor:default}
  .state{font-size:12px;color:var(--dim);margin-top:8px}
  .state:empty{display:none}
  .state.err{color:var(--err)} .state.ok{color:var(--ok)}

  .picker{position:relative}
  .picked{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .picked:empty{display:none}
  .suggest{position:absolute;left:0;right:0;top:100%;margin-top:2px;background:var(--panel);border:1px solid var(--line2);
           border-radius:8px;max-height:220px;overflow:auto;z-index:15;display:none;box-shadow:0 8px 24px #0008}
  .suggest div{padding:6px 10px;cursor:pointer;font-size:12px}
  .suggest div:hover,.suggest div.hl{background:var(--panel2);color:var(--accent)}

  #log{background:#110d0f;border:1px solid var(--line);border-radius:8px;padding:10px;height:240px;overflow:auto;
       font:12px/1.5 Consolas,"Cascadia Mono",monospace;white-space:pre-wrap;word-break:break-word;color:#d7c9d0}
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--faint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
  td.sr{color:var(--accent2);white-space:nowrap;font-variant-numeric:tabular-nums}
  td.sr small{color:var(--faint);display:block}
  td.map{min-width:180px;word-break:break-word}
  td.map .diff{color:var(--dim)}
  td.why{color:var(--dim);min-width:160px;word-break:break-word}
  td.get{white-space:nowrap;font-size:12px}
  td.get a{margin-right:6px}
  .badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:10px;margin-left:4px;vertical-align:1px;
         border:1px solid var(--line2);color:var(--faint)}
  .badge.new{border-color:#2f5d3a;color:var(--ok)}
  .empty{color:var(--faint);font-size:12px;padding:6px 0}
  .shareline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .shareline input{flex:1;min-width:180px}
  code.cmd{display:block;background:#110d0f;border:1px solid var(--line);border-radius:7px;padding:8px 10px;
           font:12px Consolas,monospace;color:#e8dce2;word-break:break-all;margin:4px 0 10px;cursor:pointer}
  code.cmd:hover{border-color:var(--accent)}

  .col{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
  .col:last-child{border:none}
  .col .nm{word-break:break-word}
  .col .nm span{color:var(--faint);font-size:12px}
  .col button{background:none;border:none;color:var(--faint);cursor:pointer;font-size:15px;padding:2px 6px;border-radius:6px}
  .col button:hover{color:var(--accent);background:var(--panel2)}

  .modal{position:fixed;inset:0;background:#000a;display:none;align-items:flex-start;justify-content:center;
         z-index:50;padding:40px 16px;overflow:auto}
  .modal.open{display:flex}
  .modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:12px;width:100%;max-width:640px;padding:18px}
  .modal h3{margin:0 0 6px;font-size:16px}
  .modal p{color:var(--dim);margin:6px 0 12px;font-size:13px}
  .guide h4{margin:16px 0 6px;font-size:13px;color:var(--text)}
  .guide ol,.guide ul{margin:6px 0 10px;padding-left:20px;color:var(--dim);font-size:13px}
  .guide li{margin:4px 0}
  .guide b{color:var(--text)}
  .guide code:not(.cmd){font:12px Consolas,monospace;color:#e8dce2;background:#110d0f;padding:1px 5px;border-radius:4px}
  .env{list-style:none;padding:0;margin:8px 0 0;font-size:12.5px}
  .env li{padding:4px 0;display:flex;gap:8px}
  .env .ok{color:var(--ok)} .env .bad{color:var(--err)} .env .warn{color:var(--warn)}
  .muted{color:var(--faint);font-size:12px}
  .path{font-family:Consolas,monospace;font-size:11.5px;color:var(--dim);word-break:break-all}

  footer{color:var(--faint);font-size:11.5px;text-align:center;padding:10px 16px 18px}

  #tooltip{position:fixed;z-index:100;max-width:320px;background:#0e0b0d;color:var(--text);border:1px solid var(--line2);
           border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45;pointer-events:none;opacity:0;
           transition:opacity .12s;box-shadow:0 8px 24px #000a}
  #tooltip.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>osu!<b>drill</b><small id="version"></small></h1>
  <div class="info" id="info">…</div>
  <div class="hbtns">
    <div class="seg" id="langseg"><button data-lang="en">EN</button><button data-lang="es">ES</button><button data-lang="ru">RU</button></div>
    <button class="iconbtn" onclick="openGuide()" data-i18n="guide"></button>
    <button class="iconbtn" id="btn-changes" onclick="openChanges()" data-i18n="changes"></button>
    <button class="iconbtn" onclick="openFeedback()" data-i18n="feedback"></button>
    <button class="iconbtn" id="btn-settings" onclick="openSettings()" data-i18n="settings" hidden></button>
  </div>
</header>

<div class="banner" id="banner" hidden><span id="bannertext"></span>
  <button class="iconbtn" id="bannerbtn" onclick="openSettings()" data-i18n="open_settings"></button>
  <button class="iconbtn" id="bannerguide" onclick="openGuide()" data-i18n="how_it_works" hidden></button></div>

<!-- подборка с сайта, пришедшая в локальную версию -->
<div class="banner info" id="importbox" hidden>
  <span id="importtext"></span>
  <button class="btn go small" onclick="doImport()" data-i18n="import_ok"></button>
  <button class="btn small" onclick="cancelImport()" data-i18n="import_cancel"></button>
</div>

<main>
  <div>
    <div class="card">
      <div class="tabs">
        <button id="tab-skill" class="on" onclick="setMode('skill')" data-i18n="tab_skill"></button>
        <button id="tab-pop" onclick="setMode('pop')" data-i18n="tab_pop"></button>
        <button id="tab-tour" onclick="setMode('tour')" data-i18n="tab_tour"></button>
      </div>

      <!-- НАВЫКИ -->
      <section id="pane-skill">
        <div class="lbl"><span data-i18n="skills"></span><span class="help" tabindex="0" data-tip-key="tip_skills">?</span></div>
        <div class="chips" id="skills"></div>

        <div class="lbl"><span data-i18n="like"></span><span class="help" tabindex="0" data-tip-key="tip_like">?</span></div>
        <textarea id="like" data-i18n-ph="like_ph"></textarea>

        <div class="row wrap">
          <div><div class="lbl"><span data-i18n="like_weight"></span><span class="help" tabindex="0" data-tip-key="tip_like_weight">?</span></div>
            <input type="number" id="like_weight" value="0.7" step="0.05" min="0" max="1"></div>
          <div><div class="lbl"><span data-i18n="min_pc"></span><span class="help" tabindex="0" data-tip-key="tip_min_pc">?</span></div>
            <input type="number" id="min_pc" value="0" step="10000" min="0"></div>
          <div><div class="lbl"><span data-i18n="pop_weight"></span><span class="help" tabindex="0" data-tip-key="tip_pop_weight">?</span></div>
            <input type="number" id="pop_weight" value="0" step="2" min="0" max="30"></div>
          <div><div class="lbl"><span data-i18n="crowd_weight"></span><span class="help" tabindex="0" data-tip-key="tip_crowd_weight">?</span></div>
            <input type="number" id="crowd_weight" value="0.5" step="0.1" min="0" max="1"></div>
        </div>

        <div class="lbl"><span data-i18n="stream_bpm"></span><span class="help" tabindex="0" data-tip-key="tip_stream_bpm">?</span><span class="val" id="v_stream"></span></div>
        <div class="range" id="r_stream" data-min="100" data-max="320" data-step="5" data-lo="100" data-hi="320" data-kind="bpm"></div>

        <div class="lbl"><span data-i18n="status"></span><span class="help" tabindex="0" data-tip-key="tip_status">?</span></div>
        <div class="chips" id="status"></div>

        <details>
          <summary data-i18n="advanced"></summary>
          <div class="row wrap">
            <div><div class="lbl"><span data-i18n="pool"></span><span class="help" tabindex="0" data-tip-key="tip_pool">?</span></div>
              <input type="number" id="pool" value="260" step="20" min="20"></div>
            <div><div class="lbl"><span data-i18n="depth"></span><span class="help" tabindex="0" data-tip-key="tip_depth">?</span></div>
              <input type="number" id="depth" value="150" step="50" min="50"></div>
            <div><div class="lbl"><span data-i18n="per_set"></span><span class="help" tabindex="0" data-tip-key="tip_per_set">?</span></div>
              <input type="number" id="per_set" value="1" min="1" max="4"></div>
          </div>
          <div class="row wrap">
            <div><div class="lbl"><span data-i18n="min_score"></span><span class="help" tabindex="0" data-tip-key="tip_min_score">?</span></div>
              <input type="number" id="min_score" data-i18n-ph="auto" min="0" max="100"></div>
            <div><div class="lbl"><span data-i18n="threads"></span><span class="help" tabindex="0" data-tip-key="tip_threads">?</span></div>
              <input type="number" id="threads" value="4" min="1" max="8"></div>
          </div>
          <div class="flags localonly">
            <label class="flag"><input type="checkbox" id="local_only"><span data-i18n="local_only"></span><span class="help" tabindex="0" data-tip-key="tip_local_only">?</span></label>
            <label class="flag"><input type="checkbox" id="skip_owned"><span data-i18n="skip_owned"></span><span class="help" tabindex="0" data-tip-key="tip_skip_owned">?</span></label>
          </div>
        </details>
      </section>

      <!-- ПОПУЛЯРНЫЕ -->
      <section id="pane-pop" hidden>
        <div class="lbl"><span data-i18n="pop_fans"></span><span class="help" tabindex="0" data-tip-key="tip_pop_fans">?</span></div>
        <div class="chips" id="pskills"></div>

        <div class="lbl"><span data-i18n="status"></span><span class="help" tabindex="0" data-tip-key="tip_status">?</span></div>
        <div class="chips" id="pstatus"></div>

        <div class="flags localonly">
          <label class="flag"><input type="checkbox" id="pop_skip_owned"><span data-i18n="skip_owned"></span><span class="help" tabindex="0" data-tip-key="tip_skip_owned">?</span></label>
        </div>
      </section>

      <!-- ТУРНИРЫ -->
      <section id="pane-tour" hidden>
        <div class="lbl"><span data-i18n="slots"></span><span class="help" tabindex="0" data-tip-key="tip_slots">?</span></div>
        <div class="slotgrid" id="slots"></div>
        <div class="empty" id="nopool" hidden></div>

        <div class="lbl"><span data-i18n="digits"></span><span class="help" tabindex="0" data-tip-key="tip_digits">?</span></div>
        <div class="chips" id="digits"></div>

        <div class="lbl"><span data-i18n="tiers"></span><span class="help" tabindex="0" data-tip-key="tip_tiers">?</span></div>
        <div class="chips" id="tiers"></div>

        <div class="lbl"><span data-i18n="years"></span><span class="help" tabindex="0" data-tip-key="tip_years">?</span><span class="val" id="v_years"></span></div>
        <div class="range" id="r_years" data-min="2008" data-max="2026" data-step="1" data-lo="2008" data-hi="2026" data-kind="year"></div>

        <div class="row wrap">
          <div><div class="lbl"><span data-i18n="per_tournament"></span><span class="help" tabindex="0" data-tip-key="tip_per_tournament">?</span></div>
            <input type="number" id="per_tournament" value="3" min="1" max="30"></div>
          <div><div class="lbl"><span data-i18n="max_lookups"></span><span class="help" tabindex="0" data-tip-key="tip_max_lookups">?</span></div>
            <input type="number" id="max_lookups" value="600" step="100" min="50"></div>
        </div>

        <div class="lbl"><span data-i18n="tours"></span><span class="help" tabindex="0" data-tip-key="tip_tours">?</span></div>
        <div class="picker">
          <input type="text" id="tourinput" autocomplete="off" data-i18n-ph="tours_ph">
          <div class="suggest" id="suggest"></div>
        </div>
        <div class="picked" id="tourpicked"></div>

        <div class="lbl"><span data-i18n="sources"></span><span class="help" tabindex="0" data-tip-key="tip_sources">?</span></div>
        <div class="chips" id="sources"></div>
      </section>

      <!-- КАРТА И МУЗЫКА (для обеих вкладок) -->
      <div class="block">
        <h3 data-i18n="map_music"></h3>
        <div class="lbl"><span data-i18n="stars"></span><span class="help" tabindex="0" data-tip-key="tip_stars">?</span><span class="val" id="v_stars"></span></div>
        <div class="range" id="r_stars" data-min="0" data-max="12" data-step="0.1" data-lo="5" data-hi="6" data-kind="stars"></div>

        <div class="lbl"><span data-i18n="bpm"></span><span class="help" tabindex="0" data-tip-key="tip_bpm">?</span><span class="val" id="v_bpm"></span></div>
        <div class="range" id="r_bpm" data-min="60" data-max="360" data-step="5" data-lo="60" data-hi="360" data-kind="bpm"></div>

  guide:'Инструкция', how_it_works:'Как это работает', guide_title:'Как пользоваться osu!drill',
  guide_html:'<p>osu!drill подбирает карты osu! под навык, который хочешь тренировать, карты, похожие на твои любимые, самые популярные песни среди любителей навыка или карты из настоящих турнирных пулов, и превращает их в коллекцию в <b>osu!lazer</b>.</p>' +
    '<h4>1. Подбор</h4><ol>' +
    '<li>Выбери вкладку: <b>Навыки</b> (Streams, Jumps, Tech, Finger control…), <b>Популярные</b> (самые популярные песни среди любителей tech, streams… или самые играемые карты вообще) или <b>Турнирные пулы</b> (NM2, HD1, DT3… из 450+ турниров).</li>' +
    '<li>Настрой фильтры. У каждого есть <b>?</b> с объяснением; звёзды, BPM и длина — двусторонние ползунки.</li>' +
    '<li>Нажми <b>Подобрать карты</b> на сайте или <b>Собрать коллекцию</b> / <b>Только показать</b> в программе. В таблице видно, почему выбрана каждая карта.</li></ol>' +
    '<h4>2. В игру</h4>' +
    '<p>На сайте карты можно скачать по ссылкам в таблице или нажать <b>Добавить в игру</b> — тогда получится готовая коллекция. Сам сайт в игру записать не может, поэтому для этой кнопки нужна небольшая программа osu!drill на компьютере. Ставится одной командой:</p>' +
    '<div class="muted">Windows (PowerShell):</div><code class="cmd" onclick="copyText(this.textContent)">{win}</code>' +
    '<div class="muted">macOS / Linux:</div><code class="cmd" onclick="copyText(this.textContent)">{unix}</code>' +
    '<p>Она ставится в папку пользователя, при необходимости скачивает портативные Python и Node.js (в систему ничего не устанавливается), создаёт ярлык <b>osu!drill</b> и открывает свою страницу в браузере. Программа умеет всё то же, что сайт, и ещё собирает коллекции из уже установленных карт.</p>' +
    '<h4>3. Добавить в игру</h4><ol>' +
    '<li>Запусти osu!drill (ярлык или <code>start.bat</code>).</li>' +
    '<li>Нажми <b>Добавить в игру</b> на сайте — откроется программа и попросит подтвердить.</li>' +
    '<li>Недостающие карты скачаются и импортируются, коллекция появится в osu!lazer. Во время игры osu! откладывает импорт — он закончится, когда выйдешь в меню.</li></ol>' +
    '<p>Если сайт пишет, что не нашёл программу, хотя она запущена, — его не пустил блокировщик рекламы или настройки браузера. Нажми <b>Уже установлен — открыть</b>.</p>' +
    '<h4>Полезно знать</h4><ul>' +
    '<li>Поддерживается только <b>osu!lazer</b>: коллекции записываются в его базу.</li>' +
    '<li>Перед каждым изменением база копируется в резерв, а если версия osu! использует незнакомый формат базы, программа откажется в неё писать.</li>' +
    '<li>Карты скачиваются с osu.ppy.sh, osu.direct и catboy.best; турнирные пулы — из osu!wiki и Liquipedia, подборки игроков — с osu!Collector.</li>' +
    '<li>Открытый код (MIT): <a href="{repo}" target="_blank" rel="noopener">GitHub</a>.</li></ul>'
},

  guide:'Guide', how_it_works:'How it works', guide_title:'How to use osu!drill',
  guide_html:'<p>osu!drill picks osu! maps for the skill you want to practise, maps similar to ones you like, the most popular songs among fans of a skill, or maps from real tournament pools, and turns them into a collection in <b>osu!lazer</b>.</p>' +
    '<h4>1. Pick maps</h4><ol>' +
    '<li>Choose a tab: <b>Skills</b> (Streams, Jumps, Tech, Finger control…), <b>Popular</b> (the most popular songs among fans of tech, streams… or the most played maps overall) or <b>Tournament pools</b> (NM2, HD1, DT3… from 450+ tournaments).</li>' +
    '<li>Set the filters. Every filter has a <b>?</b> with an explanation; stars, BPM and length are two-handle sliders.</li>' +
    '<li>Press <b>Find maps</b> on the website, or <b>Build collection</b> / <b>Preview only</b> in the desktop app. The table shows why each map was picked.</li></ol>' +
    '<h4>2. Get them into osu!</h4>' +
    '<p>On the website you can download the maps from the links in the table, or press <b>Add to game</b> to get a ready collection. The website can’t write into your game by itself, so “Add to game” needs the small osu!drill app on your computer. Install it with one command:</p>' +
    '<div class="muted">Windows (PowerShell):</div><code class="cmd" onclick="copyText(this.textContent)">{win}</code>' +
    '<div class="muted">macOS / Linux:</div><code class="cmd" onclick="copyText(this.textContent)">{unix}</code>' +
    '<p>It installs into your user folder, downloads portable Python and Node.js if needed (nothing is installed system-wide), creates an <b>osu!drill</b> shortcut and opens its own page in your browser. The app does everything the website does and can also build collections from maps you already have.</p>' +
    '<h4>3. Add to game</h4><ol>' +
    '<li>Start osu!drill (the shortcut or <code>start.bat</code>).</li>' +
    '<li>Press <b>Add to game</b> on the website: the app opens and asks you to confirm.</li>' +
    '<li>Missing maps are downloaded and imported, and the collection appears in osu!lazer. During gameplay osu! pauses imports; they finish when you’re back in the menu.</li></ol>' +
    '<p>If the website says it can’t find the app while it’s running, an ad blocker or a browser setting stopped the site from talking to it. Press <b>Already installed — open</b>.</p>' +
    '<h4>Good to know</h4><ul>' +
    '<li>Only <b>osu!lazer</b> is supported: collections are written into its database.</li>' +
    '<li>The database is backed up before every change, and the app refuses to write if your osu! version uses an unknown database format.</li>' +
    '<li>Maps are downloaded from osu.ppy.sh, osu.direct and catboy.best; tournament pools come from the osu!wiki and Liquipedia, player collections from osu!Collector.</li>' +
    '<li>Open source (MIT): <a href="{repo}" target="_blank" rel="noopener">GitHub</a>.</li></ul>'
},

let LANG = 'en', MODE = 'skill',   /* английский по умолчанию; выбор языка запоминается */ DATA = null, JOB = null, SEEN = 0, TIMER = null, LASTRESULT = null, SITE = false;
let IMPORT = null;
const LOCAL_APP = 'http://127.0.0.1:8730';
const picked = { skills:new Set(['fingercontrol']), status:new Set(['ranked']), pstatus:new Set(['ranked','loved']),
                 slots:new Set(), digits:new Set(), tiers:new Set(), sources:new Set(), genres:new Set(), tours:[] };
const $ = id => document.getElementById(id);
const t = (k, vars) => { let s = (T[LANG] && T[LANG][k]) || T.ru[k] || k;
  if (vars) for (const [a, b] of Object.entries(vars)) s = s.split('{' + a + '}').join(b); return s; };
/* «1 карта, 2 карты, 5 карт» */
/* поле объекта на текущем языке: desc, desc_en, desc_es (русский - без суффикса) */
const L = (obj, base) => LANG === 'ru' ? obj[base] : (obj[base + '_' + LANG] || obj[base + '_en']);
function mapsText(n){
  n = +n; const s = n.toLocaleString(LANG);
  if (LANG === 'en') return s + (n === 1 ? ' map' : ' maps');
  if (LANG === 'es') return s + (n === 1 ? ' mapa' : ' mapas');
  const d = n % 10, h = n % 100;
  return s + (d === 1 && h !== 11 ? ' карта' : d >= 2 && d <= 4 && (h < 12 || h > 14) ? ' карты' : ' карт');
}
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FIELDS = ['like','like_weight','min_pc','pop_weight','crowd_weight','pool','depth','per_set','min_score','threads','local_only',
  'skip_owned','pop_skip_owned','per_tournament','max_lookups','count','name','split','no_download','no_collection','words'];
const RANGES = ['r_stars','r_bpm','r_length','r_stream','r_years'];

function store(){ try{ localStorage.setItem('osu-trainer', JSON.stringify({
  lang:LANG, mode:MODE, sets:Object.fromEntries(Object.entries(picked).map(([k, v]) => [k, v instanceof Set ? [...v] : v])),
  fields:Object.fromEntries(FIELDS.map(f => [f, $(f).type === 'checkbox' ? $(f).checked : $(f).value])),
  ranges:Object.fromEntries(RANGES.map(r => [r, rangeGet(r)])) })); }catch(e){} }
function restore(){ try{ const s = JSON.parse(localStorage.getItem('osu-trainer') || 'null'); if (!s || !s.sets) return;
  LANG = s.lang || LANG; MODE = s.mode || MODE;
  for (const [k, v] of Object.entries(s.sets)) if (k in picked) picked[k] = Array.isArray(picked[k]) ? v : new Set(v);
  for (const [f, v] of Object.entries(s.fields || {})) if ($(f)) { if ($(f).type === 'checkbox') $(f).checked = v; else $(f).value = v; }
  for (const [r, v] of Object.entries(s.ranges || {})) if ($(r) && v) { $(r).dataset.lo = v[0]; $(r).dataset.hi = v[1]; }
}catch(e){} }

/* ============================== двусторонние ползунки ============================== */
function fmtRange(el, lo, hi){
  const kind = el.dataset.kind, min = +el.dataset.min, max = +el.dataset.max;
  const f = v => kind === 'time' ? Math.floor(v / 60) + ':' + String(v % 60).padStart(2, '0')
               : kind === 'stars' ? (+v).toFixed(1) : String(v);
  if (lo <= min && hi >= max) return kind === 'stars' ? f(lo) + ' – ' + f(hi) + '+' : t({time:'any_len', year:'any_year'}[kind] || 'any_bpm');
  if (lo <= min) return t('to') + ' ' + f(hi);
  if (hi >= max) return kind === 'stars' ? f(lo) + '+' : t('from') + ' ' + f(lo);
  return f(lo) + ' – ' + f(hi) + (kind === 'stars' ? '★' : '');
}
function rangeInit(id){
  const el = $(id);
  el.innerHTML = '<div class="track"></div><div class="fill"></div><input type="range" class="lo"><input type="range" class="hi">';
  const [lo, hi] = el.querySelectorAll('input');
  for (const inp of [lo, hi]) { inp.min = el.dataset.min; inp.max = el.dataset.max; inp.step = el.dataset.step; }
  lo.value = el.dataset.lo; hi.value = el.dataset.hi;
  lo.setAttribute('aria-label', id + ' min'); hi.setAttribute('aria-label', id + ' max');
  const update = (moved) => {
    let a = +lo.value, b = +hi.value;
    if (a > b) { if (moved === lo) lo.value = a = b; else hi.value = b = a; }
    const min = +el.dataset.min, max = +el.dataset.max, fill = el.querySelector('.fill');
    fill.style.left = ((a - min) / (max - min) * 100) + '%';
    fill.style.width = ((b - a) / (max - min) * 100) + '%';
    lo.style.zIndex = a >= max - (max - min) * 0.02 ? 3 : 2;   // левый ползунок у правого края должен оставаться доступным
    el.dataset.lo = a; el.dataset.hi = b;
    const val = $('v_' + id.slice(2)); if (val) val.textContent = fmtRange(el, a, b);
  };
  lo.addEventListener('input', () => update(lo)); hi.addEventListener('input', () => update(hi));
  lo.addEventListener('change', store); hi.addEventListener('change', store);
  update();
}
function rangeGet(id){ const el = $(id); return [+el.dataset.lo, +el.dataset.hi]; }
/* диапазон для запроса: края ползунка = без ограничения с этой стороны; всё открыто = фильтра нет */
function rangeParam(id, openLo, openHi, always){
  const el = $(id), [a, b] = rangeGet(id), min = +el.dataset.min, max = +el.dataset.max;
  if (!always && a <= min && b >= max) return '';
  return (a <= min ? openLo : a) + '-' + (b >= max ? openHi : b);
}
function rangesRefresh(){ RANGES.forEach(id => { const el = $(id), [a, b] = rangeGet(id);
  const val = $('v_' + id.slice(2)); if (val) val.textContent = fmtRange(el, a, b); }); }

/* ============================== i18n ============================== */
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
  document.querySelectorAll('[data-tip-key]').forEach(el => { el.dataset.tip = t(el.dataset.tipKey);
    if (el.classList.contains('help')) el.setAttribute('aria-label', el.dataset.tip); });
  document.querySelectorAll('#langseg button').forEach(b => b.classList.toggle('on', b.dataset.lang === LANG));
  $('btn-run').textContent = t(SITE ? 'btn_run_server' : 'btn_run');
  $('btn-run').dataset.tip = t(SITE ? 'tip_run_server' : 'tip_run');
  $('footer').innerHTML = t('footer');
  rangesRefresh();
  if (DATA) render();
  if (IMPORT && IMPORT.preview) showImport();
  if (DATA) updateShare();
  if ($('guide').classList.contains('open')) openGuide();
  if ($('changes').classList.contains('open')) openChanges(CHANGES_SINCE);
  if ($('feedback').classList.contains('open')) openFeedback();
}

/* ============================== подсказки ============================== */
const tipEl = $('tooltip');
let tipFor = null;
function showTip(el){
  const text = el.dataset.tip; if (!text) return;
  tipFor = el; tipEl.textContent = text; tipEl.classList.add('show');
  const r = el.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight, m = 8;
  let x = r.left + r.width / 2 - w / 2, y = r.bottom + 8;
  if (y + h > innerHeight - m) y = r.top - h - 8;
  x = Math.max(m, Math.min(x, innerWidth - w - m)); y = Math.max(m, y);
  tipEl.style.left = x + 'px'; tipEl.style.top = y + 'px';
}
function hideTip(){ tipFor = null; tipEl.classList.remove('show'); }
document.addEventListener('mouseover', e => { const el = e.target.closest('[data-tip]');
  if (el) { if (el !== tipFor) showTip(el); } else if (tipFor) hideTip(); });
document.addEventListener('mouseout', e => { const el = e.target.closest('[data-tip]');
  if (el && !el.contains(e.relatedTarget)) hideTip(); });
document.addEventListener('focusin', e => { const el = e.target.closest('[data-tip]'); if (el) showTip(el); });
document.addEventListener('focusout', hideTip);
document.addEventListener('click', e => { const el = e.target.closest('.help');
  if (el) { e.preventDefault(); tipFor === el ? hideTip() : showTip(el); } });
addEventListener('scroll', hideTip, true);

/* ============================== сеть ============================== */
async function api(path, body){
  const opt = body === undefined ? {} : { method:'POST', headers:{'Content-Type':'application/json','X-Requested-With':'osu-trainer'},
                                          body:JSON.stringify(body) };
  const r = await fetch(path, opt);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || r.status); e.status = r.status; throw e; }
  return d;
}

/* ============================== отрисовка ============================== */
function chip(label, opts){
  const d = document.createElement('div');
  d.className = 'chip' + (opts.on ? ' on' : '');
  d.setAttribute('role', 'button'); d.tabIndex = 0;
  d.innerHTML = esc(label) + (opts.sub != null ? '<small>' + esc(opts.sub) + '</small>' : '');
  if (opts.tip) d.dataset.tip = opts.tip;
  const act = () => { opts.click(d); store(); };
  d.onclick = act; d.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } };
  return d;
}
function toggler(set, key){ return el => { set.has(key) ? set.delete(key) : set.add(key); el.classList.toggle('on', set.has(key)); }; }
function chips(box, items, set){
  box.innerHTML = '';
  items.forEach(it => box.appendChild(chip(it.label, { on:set.has(it.key), sub:it.sub, tip:it.tip, click:toggler(set, it.key) })));
}

function render(){
  const d = DATA, pool = d.pool;
  $('version').textContent = 'v' + d.version;
  $('info').textContent = SITE ? (pool ? t('info_site', {m:mapsText(pool.entries), e:pool.editions}) : '')
    : pool ? t('info', {c:d.collections.length, m:mapsText(pool.entries)}) : t('info_nopool', {c:d.collections.length});

  renderSkills();
  const statuses = ['ranked','loved','approved','qualified'].map(s => ({key:s, label:s}));
  chips($('status'), statuses, picked.status);
  chips($('pstatus'), statuses, picked.pstatus);
  chips($('genres'), d.genres.map(g => ({ key:String(g.id), label:g[LANG] || g.en })), picked.genres);

  const g = $('slots'); g.innerHTML = '';
  $('nopool').hidden = !!pool; $('nopool').textContent = t('pools_empty');
  if (pool){
    const groups = {};
    pool.slots.forEach(([slot, n]) => { if (n < 25) return; const mod = slot.replace(/\d+$/, ''); (groups[mod] = groups[mod] || []).push([slot, n]); });
    ['NM','HD','HR','DT','FM','TB','EZ','FL'].forEach(mod => {
      if (!groups[mod]) return;
      const row = document.createElement('div'); row.className = 'slotrow';
      const b = document.createElement('button'); b.className = 'mod'; b.textContent = mod; b.type = 'button';
      b.onclick = () => { const all = groups[mod].map(x => x[0]); const on = all.every(s => picked.slots.has(s));
        all.forEach(s => on ? picked.slots.delete(s) : picked.slots.add(s)); store(); render(); };
      const box = document.createElement('div'); box.className = 'chips';
      groups[mod].forEach(([slot, n]) => box.appendChild(chip(slot, { on:picked.slots.has(slot), sub:n, click:toggler(picked.slots, slot) })));
      row.appendChild(b); row.appendChild(box); g.appendChild(row);
    });
    const dg = pool.digits || {};
    chips($('digits'), [['open','open'],['3','3-digit'],['4','4-digit'],['5','5-digit'],['6','6-digit'],['unknown','?']].map(([k, lab]) => {
      const n = k === 'unknown' ? dg['?'] : k === '6' ? (dg['6-digit'] || 0) + (dg['7-digit'] || 0) : dg[lab];
      return { key:k, label:k === 'unknown' ? t('unknown') : lab, sub:n || 0 };
    }), picked.digits);
    const tr = pool.tiers || {};
    chips($('tiers'), ['S','A','B','C','D','?'].map(k => ({ key:k, label:k, sub:tr[k] || 0 })), picked.tiers);
    const sr = pool.sources || {};
    chips($('sources'), ['osu!wiki','Liquipedia'].map(k => ({ key:k, label:k, sub:sr[k] || 0 })), picked.sources);
  } else { ['digits','tiers','sources'].forEach(id => $(id).innerHTML = ''); }
  renderTours();
  if (!SITE) { renderCollections(); renderEnv(); }
  if (LASTRESULT) showResults(LASTRESULT);
  updateButtons();
}

function suggest(){
  const q = $('tourinput').value.trim().toLowerCase(), box = $('suggest');
  const list = (DATA && DATA.pool) ? DATA.pool.tournaments : [];
  const items = q ? list.filter(n => n.toLowerCase().includes(q) && !picked.tours.includes(n)).slice(0, 40) : [];
  box.innerHTML = '';
  if (q && !items.some(n => n.toLowerCase() === q)) items.unshift('«' + $('tourinput').value.trim() + '»');
  items.forEach((n, i) => { const d = document.createElement('div'); d.textContent = n; if (!i) d.className = 'hl';

/* номера сложностей из ссылок (…#osu/123, /b/123, /beatmaps/123) и просто чисел; номер набора не нужен */
function ids(text){
  const out = [], add = v => { if (!out.includes(v)) out.push(v); };
  for (const m of text.matchAll(/#osu\/(\d+)|\/(?:b|beatmaps)\/(\d+)/g)) add(m[1] || m[2]);
  text.replace(/https?:\/\/\S+/g, ' ').replace(/\b(\d{3,})\b/g, (_m, v) => { add(v); return ''; });
  return out.join(',');
}
const num = id => $(id).value === '' ? undefined : +$(id).value;

function params(dry){
  const p = { lang:LANG, stars:rangeParam('r_stars', 0, 20, true), count:num('count') || 30,
              name:$('name').value.trim(), dry_run:dry, no_download:$('no_download').checked,
              no_collection:$('no_collection').checked, split:num('split'),
              bpm:rangeParam('r_bpm', 0, 10000), length:rangeParam('r_length', 0, 100000),
              genres:[...picked.genres].join(','), words:$('words').value.trim() };
  if (MODE === 'tour'){
    if (!picked.slots.size){ alert(t('need_slot')); return null; }
    Object.assign(p, { tournament:[...picked.slots].join(','), years:rangeParam('r_years', 2000, 2100),
      tours:picked.tours.join(','), digits:[...picked.digits].join(','), tiers:[...picked.tiers].join(','),
      sources:[...picked.sources].join(','), per_tournament:num('per_tournament'), max_lookups:num('max_lookups') });
  } else if (MODE === 'pop'){
    /* навык не выбран - самые играемые карты вообще */
    Object.assign(p, { popular:true, skill:[...picked.skills].join(','),
      status:[...picked.pstatus].join(',') || 'ranked,loved', skip_owned:$('pop_skip_owned').checked });
  } else {
    const like = ids($('like').value);
    if (!picked.skills.size && !like){ alert(t('need_skill')); return null; }
    Object.assign(p, { skill:[...picked.skills].join(','), like:like, like_weight:num('like_weight'),
      min_pc:num('min_pc'), pop_weight:num('pop_weight'), crowd_weight:num('crowd_weight'),
      stream_bpm:rangeParam('r_stream', 0, 1000),
      status:[...picked.status].join(',') || 'ranked', pool:num('pool'), depth:num('depth'),
      per_set:num('per_set'), threads:num('threads'), local_only:$('local_only').checked, skip_owned:$('skip_owned').checked,
      min_score:num('min_score') });
  }
  return p;
}

async function run(dry){
  const p = params(dry); if (!p) return;
  store(); LASTRESULT = null; LASTPARAMS = p;
  $('log').textContent = ''; $('results').querySelector('tbody').innerHTML = ''; $('rescount').textContent = '';
  $('noresults').hidden = false; updateShare();
  setState(t('working'), '');
  try { const r = await api('/api/run', p); follow(r.id); }
  catch(e){ setState(e.status === 429 ? t('too_many') : e.message, 'err'); }
}

  $('log').textContent = ''; setState(t('pools_building'), '');
  try { const r = await api('/api/pools/refresh', {lang:LANG}); follow(r.id); closeModal('settings'); } catch(e){ setState(e.message, 'err'); }
}
function follow(id){ JOB = id; SEEN = 0; updateButtons(); clearInterval(TIMER); TIMER = setInterval(poll, 800); }
async function stop(){ if (JOB) try { await api('/api/cancel', {id:JOB}); } catch(e){} }
function setState(text, cls){ $('state').textContent = text; $('state').className = 'state ' + (cls || ''); }

async function poll(){
  if (!JOB) return;
  let d; try { d = await api('/api/job?id=' + encodeURIComponent(JOB) + '&from=' + SEEN); } catch(e){ return; }
  if (d.lines && d.lines.length){
    SEEN = d.total; const log = $('log');
    log.textContent += (log.textContent ? '\n' : '') + d.lines.join('\n'); log.scrollTop = log.scrollHeight;
  }
  if (d.state === 'queued') { setState(t('queued'), ''); return; }
  if (d.state === 'running') { if ($('state').textContent === t('queued')) setState(t('working'), ''); return; }
  clearInterval(TIMER); TIMER = null; JOB = null; updateButtons();
  if (d.state === 'done'){
    setState(t('done'), 'ok');
    if ((d.kind === 'run' || d.kind === 'import') && d.result){ LASTRESULT = d.result; showResults(d.result); }
    if (!SITE) load();
  }
  else if (d.state === 'cancelled') setState(t('cancelled'), '');
  else setState(d.error || 'error', 'err');
}

function showResults(res){
  const tb = $('results').querySelector('tbody');
  tb.innerHTML = '<tr><th>★</th><th>' + esc(t('th_map')) + '</th><th>' + esc(t('th_why')) + '</th>' +
                 (SITE ? '<th>' + esc(t('th_get')) + '</th>' : '') + '</tr>';
  res.picked.forEach(c => {

    const why = c.page ? '<a href="' + esc(c.page) + '" target="_blank" rel="noopener">' + esc(c.why) + '</a>' : esc(c.why);
    const badge = c.owned == null ? '' : '<span class="badge ' + (c.owned ? '' : 'new') + '">' + esc(c.owned ? t('owned') : t('new_')) + '</span>';
    const links = SITE ? '<td class="get">' + (c.links || []).map(([l, u]) => '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(l) + '</a>').join('') + '</td>' : '';
    tr.innerHTML = '<td class="sr">' + (+c.sr).toFixed(2) + (c.score ? '<small>' + c.score + '</small>' : '') + '</td>' +
      '<td class="map"><a href="https://osu.ppy.sh/b/' + (+c.bid) + '" target="_blank" rel="noopener">' + esc(c.artist) + ' - ' + esc(c.title) +
      '</a> <span class="diff">[' + esc(c.diff) + ']</span>' + badge + '</td><td class="why">' + why + '</td>' + links;
    tb.appendChild(tr);
  });
  $('noresults').hidden = res.picked.length > 0;
  $('rescount').textContent = (res.name ? ' · ' + res.name : '') + t('res_count', {m:mapsText(res.picked.length)}) + (res.downloaded ? t('res_dl', {n:res.downloaded}) : '');

  }
  updateShare();
}

const SEEN_KEY = 'osu-trainer-seen';
let CHANGES_SINCE = null;
function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
function openChanges(since){
  CHANGES_SINCE = since || null;
  const day = id => new Date(id + 'T12:00:00').toLocaleDateString(LANG, {day:'numeric', month:'long', year:'numeric'});
  $('changesbody').innerHTML = CHANGES.filter(c => !CHANGES_SINCE || c.id > CHANGES_SINCE).map(c =>
    '<h4>' + esc(c.v + ' · ' + day(c.id)) + '</h4><ul>' + (c[LANG] || c.en).map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>').join('');
  $('changes').classList.add('open');
  lsSet(SEEN_KEY, CHANGES[0].id);
  $('btn-changes').classList.remove('dot');
}
function checkChanges(){
  const seen = lsGet(SEEN_KEY), latest = CHANGES[0].id;
  if (seen === latest) return;
  if (FIRST_VISIT) { lsSet(SEEN_KEY, latest); return; }   // первый заход: только запоминаем
  $('btn-changes').classList.add('dot');
  // пришёл за конкретной подборкой или уже открыто другое окно - не мешаем, точка на кнопке останется
  if (/[?&](import|share)=/.test(location.search) || document.querySelector('.modal.open')) return;
  openChanges(seen || (CHANGES[1] && CHANGES[1].id));
}

function openGuide(){
  const ins = (DATA && DATA.install) || {};
  $('guidebody').innerHTML = t('guide_html', {win:esc(ins.windows || ''), unix:esc(ins.unix || ''), repo:esc(ins.repo || '#')});
  $('guide').classList.add('open');
}
async function saveSettings(){
  const body = {}; ['osu_data','osu_exe','contact','project_url'].forEach(k => body[k] = $('cfg_' + k).value.trim());
  body.language = LANG;
  try { await api('/api/config', body); await load(); } catch(e){ alert(e.message); }
}

document.querySelectorAll('#langseg button').forEach(b => b.onclick = () => {
  LANG = b.dataset.lang; applyLang(); store(); if (!SITE) api('/api/config', {language:LANG}).catch(() => {}); });
FIELDS.forEach(f => $(f).addEventListener('change', store));

async function load(){
  try { DATA = await api('/api/init?lang=' + LANG); }
  catch(e){ $('info').textContent = e.message; return; }
  const wasSite = SITE; SITE = DATA.mode === 'server';
  document.querySelectorAll('.localonly').forEach(el => el.hidden = SITE);
  $('btn-settings').hidden = SITE;
  if (SITE){ $('banner').hidden = false; $('banner').className = 'banner info'; $('bannertext').textContent = t('banner_site');
             $('bannerbtn').hidden = true; $('bannerguide').hidden = false; }
  if (SITE !== wasSite) applyLang();
  render();
  updateShare();
}

// первый ли это заход - узнаём до того, как setMode() сохранит настройки
const FIRST_VISIT = !lsGet('osu-trainer') && !lsGet(SEEN_KEY);
restore();
RANGES.forEach(rangeInit);
applyLang(); setMode(MODE);
load().then(() => { checkImport(); checkShare(); checkChanges(); });
</script>
