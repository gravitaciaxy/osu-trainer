# nginx: /etc/nginx/sites-available/osu  ->  ln -s в sites-enabled
# HTTPS добавит: sudo certbot --nginx -d osu.gravitacia.art
limit_req_zone $binary_remote_addr zone=osu_run:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name osu.gravitacia.art;

    client_max_body_size 64k;

    # запуск подбора - не чаще 6 в минуту с одного адреса (приложение само ограничивает ещё строже)
    location = /api/run {
        include snippets/security-headers.conf;
        limit_req zone=osu_run burst=3 nodelay;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        include snippets/security-headers.conf;
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
