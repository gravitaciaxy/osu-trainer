<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>osu!drill · тренер</title>
<style>
  :root{
    --bg:#161214; --panel:#221b1f; --panel2:#2c2328; --line:#3b2f36; --line2:#4a3b44;
    --text:#f3eaef; --dim:#ab99a2; --faint:#7d6c75;
    --accent:#ff66aa; --accent-ink:#2a0d1b; --accent2:#66ccff; --ok:#7ddf90; --warn:#ffcc66; --err:#ff8a8a;
    --c-great:#66ccff; --c-ok:#7ddf90; --c-meh:#ffcc66; --c-miss:#ff6b6b;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;min-height:100vh}
  button,input,textarea,select{font:inherit;color:inherit}
  a{color:var(--accent2);text-decoration:none}
  a:hover{text-decoration:underline}
  [hidden]{display:none !important}
  header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);
         position:sticky;top:0;z-index:20;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;white-space:nowrap}
  header h1 b{color:var(--accent)}
  header h1 small{color:var(--dim);font-size:13px;font-weight:400;margin-left:6px}
  header .info{color:var(--dim);font-size:12px;flex:1;min-width:160px}
  .iconbtn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:5px 10px;cursor:pointer;
           color:var(--text);font-size:12px;white-space:nowrap;display:inline-block}
  .iconbtn:hover{border-color:var(--accent);text-decoration:none}
  nav.tabs{display:flex;gap:6px;padding:12px 20px 0;max-width:1300px;margin:0 auto;flex-wrap:wrap}
  nav.tabs button{padding:8px 14px;border:1px solid var(--line2);background:var(--panel2);color:var(--dim);border-radius:8px;cursor:pointer}
  nav.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  main{max-width:1300px;margin:0 auto;padding:14px 20px 120px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:14px;align-items:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:14px}
  .card h2{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card h3{margin:14px 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--faint)}
  .card p{margin:6px 0;color:var(--dim)}
  .muted{color:var(--faint);font-size:12px}
  .big{font-size:22px;font-weight:700}
  .btn{padding:9px 14px;border-radius:8px;cursor:pointer;font-size:13px;border:1px solid var(--line2);background:var(--panel2);color:var(--text)}
  .btn:hover:not(:disabled){border-color:var(--accent)}
  .btn.go{border:none;background:var(--accent);color:var(--accent-ink);font-weight:700}
  .btn.small{padding:5px 10px;font-size:12px}
  .btn:disabled{opacity:.45;cursor:default}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;border:1px solid var(--line2);color:var(--dim);font-weight:500}
  .badge.acc{border-color:var(--accent);color:var(--accent)}
  .badge.ok{border-color:#2f5d3a;color:var(--ok)}
  .badge.bad{border-color:#6b2a2a;color:var(--err)}
  .badge.warn{border-color:#6b4a1f;color:var(--warn)}
  .badge.mod{border-color:#28465a;color:var(--accent2)}
  .code{font:12px/1.3 Consolas,"Cascadia Mono",monospace;padding:2px 8px;border-radius:6px;border:1px dashed var(--line2);
        background:var(--panel2);color:var(--text);cursor:pointer;white-space:nowrap}
  .code:hover{border-color:var(--accent)}
  .code.big{font-size:17px;padding:5px 12px;border-style:solid;border-color:var(--accent)}
  .code.done{border-color:#2f5d3a;color:var(--ok)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--faint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  tr.click{cursor:pointer}
  tr.click:hover td{background:var(--panel2)}
  .tablewrap{overflow-x:auto}
  .steps{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
  .step{padding:4px 9px;border-radius:14px;border:1px solid var(--line2);font-size:11.5px;color:var(--faint)}
  .step.done{border-color:#2f5d3a;color:var(--ok)}
  .step.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
  .step.lock{opacity:.55}
  .warnbox{border:1px solid #6b4a1f;background:#2d2216;color:var(--warn);border-radius:8px;padding:10px 12px;margin:10px 0}
  .errbox{border:1px solid #6b2a2a;background:#2d1818;color:var(--err);border-radius:8px;padding:10px 12px;margin:10px 0}
  .weak{border-left:3px solid var(--accent);padding:4px 10px;margin:8px 0}
  .weak b{display:block}
  .weak span{color:var(--dim);font-size:12.5px}
  ul.plain{margin:6px 0;padding-left:18px;color:var(--dim)}
  ul.plain li{margin:3px 0}
  .split{display:grid;grid-template-columns:minmax(260px,340px) minmax(0,1fr);gap:14px;align-items:start}
  @media (max-width:900px){ .split{grid-template-columns:minmax(0,1fr)} }
  .sess{padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;background:var(--panel)}
  .sess:hover{border-color:var(--accent)}
  .sess.on{border-color:var(--accent);background:var(--panel2)}
  .kpis{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 4px}
  .kpi{min-width:84px}
  .kpi .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
  .kpi .l{font-size:11px;color:var(--faint)}
  .causes{display:flex;height:12px;border-radius:6px;overflow:hidden;margin:6px 0;background:var(--panel2)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:0}
  svg text{fill:var(--faint);font-size:11px}
  .modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 14px;overflow:auto}
  .modal.open{display:flex}
  .modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:12px;width:100%;max-width:1100px;padding:18px 20px}
  .modal .box.narrow{max-width:660px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
  .chip{padding:6px 11px;border-radius:16px;border:1px solid var(--line2);background:var(--panel2);color:var(--dim);cursor:pointer;font-size:13px}
  .chip small{color:var(--faint);margin-left:3px}
  .chip:hover{border-color:var(--accent)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .chip.on small{color:var(--accent-ink);opacity:.7}
  .chip.farm.on{background:var(--warn);border-color:var(--warn);color:#2a1d05}
  .jobpanel{position:fixed;right:16px;bottom:16px;width:min(560px,calc(100vw - 32px));background:#110d0f;border:1px solid var(--line2);
            border-radius:10px;z-index:60;box-shadow:0 10px 30px #000c}
  .jobhead{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
  .jobhead b{flex:1;font-size:13px}
  #joblog{margin:0;padding:10px;height:220px;overflow:auto;font:12px/1.5 Consolas,"Cascadia Mono",monospace;white-space:pre-wrap;color:#d7c9d0}
  textarea{width:100%;min-height:70px;padding:8px 10px;background:var(--panel2);border:1px solid var(--line2);border-radius:7px;color:var(--text)}
  select{background:var(--panel2);border:1px solid var(--line2);border-radius:7px;padding:6px 8px}
  .ok{color:var(--ok)} .bad{color:var(--err)} .warn{color:var(--warn)}
</style>
</head>
<body>
<header>
  <h1>osu!<b>drill</b><small>тренер</small></h1>
  <div class="info" id="info">загружаю…</div>
  <button class="iconbtn" onclick="refresh(true)">Обновить</button>
  <a class="iconbtn" href="/">Подбор карт</a>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="today" class="on">Сегодня</button>
  <button data-tab="ladders">Лестницы</button>
  <button data-tab="review">Разборы</button>
  <button data-tab="profile">Профиль</button>
  <button data-tab="progress">Прогресс</button>
  <button data-tab="test">Тест</button>
  <button data-tab="control">Контрольные</button>
</nav>
<main>
  <div id="error"></div>
  <section id="tab-today"></section>
  <section id="tab-ladders" hidden></section>
  <section id="tab-review" hidden></section>
  <section id="tab-profile" hidden></section>
  <section id="tab-progress" hidden></section>
  <section id="tab-test" hidden></section>
  <section id="tab-control" hidden></section>
</main>

<div class="jobpanel" id="jobpanel" hidden>
  <div class="jobhead"><b id="jobtitle">Работаю…</b>
    <button class="iconbtn" id="jobstop" onclick="stopJob()">Остановить</button>
    <button class="iconbtn" onclick="$('jobpanel').hidden = true">Скрыть</button></div>
  <pre id="joblog"></pre>
</div>
<div class="modal" id="playmodal" onclick="if(event.target===this)closePlay()"><div class="box" id="playbox"></div></div>
<div class="modal" id="askmodal" onclick="if(event.target===this)closeAsk()"><div class="box narrow" id="askbox"></div></div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S = null, TAB = 'today', SESSION = null, JOB = null, JOBSEEN = 0, JOBTIMER = null, LASTUPD = null, LASTRND = null, LASTPROF = null, BUSY = false;

const OFFLINE = 'Программа osu!drill не отвечает — похоже, она закрыта. Запусти её (start.bat в папке osu-trainer): страница переподключится сама.';
async function api(path, body){
  const opt = body === undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json','X-Requested-With':'osu-trainer'}, body:JSON.stringify(body)};
  let r;
  try { r = await fetch(path, opt); } catch(e){ throw new Error(OFFLINE); }   /* сеть: программа не запущена */
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || ('ошибка ' + r.status));
  return d;
}
const pct = (x, d = 1) => x == null ? '—' : (x * 100).toFixed(d) + '%';
const num = (x, d = 0) => x == null ? '—' : (+x).toFixed(d);
function dt(ts){ const d = new Date(ts * 1000); return d.toLocaleDateString('ru', {day:'numeric', month:'short'}) + ' ' + d.toLocaleTimeString('ru', {hour:'2-digit', minute:'2-digit'}); }
function day(ts){ return new Date(ts * 1000).toLocaleDateString('ru', {day:'numeric', month:'long'}); }
function dayY(ts){ return new Date(ts * 1000).toLocaleDateString('ru', {day:'numeric', month:'short', year:'numeric'}); }   // старые скоры - с годом
function mmss(sec){ sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
function ago(ts){ const s = Date.now() / 1000 - ts; if (s < 90) return 'только что'; if (s < 3600) return Math.round(s / 60) + ' мин назад';
  if (s < 86400) return Math.round(s / 3600) + ' ч назад'; return Math.round(s / 86400) + ' дн назад'; }
const RANK = {'-1':'F', 0:'D', 1:'C', 2:'B', 3:'A', 4:'S', 5:'S', 6:'SS', 7:'SS'};
const mods = m => (m && m.length ? m.map(x => '<span class="badge mod">' + esc(x) + '</span>').join(' ') : '');
const mapName = r => esc(r.artist) + ' — ' + esc(r.title) + ' <span class="muted">[' + esc(r.diff) + ']</span>';
const tagName = t => (S && S.tag_names[t]) || t;
// код для поиска в выборе карты lazer: номер сложности находит её сам; без номера - название и сложность
const mapCode = m => +m.bid > 0 ? String(+m.bid) :
  'title="' + String(m.title || '').replace(/"/g, '') + '" diff="' + String(m.diff || '').replace(/"/g, '') + '"';
const codeChip = (m, big) => '<button class="code' + (big ? ' big' : '') + '" data-code="' + esc(mapCode(m)) +
  '" title="Скопировать, чтобы вставить в поиск в выборе карты osu!" onclick="copyCode(event, this)">' + esc(mapCode(m)) + '</button>';
function copyCode(ev, el){
  ev.stopPropagation();
  const text = el.dataset.code;
  const fallback = () => { const t = document.createElement('textarea'); t.value = text; t.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); };
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).catch(fallback).then(() => {
    el.classList.add('done'); el.textContent = 'скопировано ✓';
    setTimeout(() => { el.classList.remove('done'); el.textContent = text; }, 1400);
  }, () => {});
}

/* ============================== загрузка ============================== */
async function refresh(force){
  try {
    if (force) await api('/api/coach/refresh', {});
    S = await api('/api/coach/state');
    $('error').innerHTML = S.error ? '<div class="errbox">' + esc(S.error) + '</div>' : '';
    $('info').textContent = 'попыток в базе: ' + S.plays + ' · твой уровень ~' + num(S.comfort, 2) + '★' +
      (S.updated ? ' · обновлено ' + ago(S.updated) : '');
    // следующую случайную карту готовит фон без новых попыток - её тоже надо показать сразу
    const rnd = JSON.stringify(S.random);
    // и ход проверки профиля osu!: она идёт больше часа, а новых попыток за это время может не быть
    const pr = (S.control && S.control.profile) || {};
    const prof = JSON.stringify([pr.run, pr.ts]);
    if (S.updated !== LASTUPD || force || (TAB === 'today' && rnd !== LASTRND) || (TAB === 'control' && prof !== LASTPROF)){
      LASTUPD = S.updated; LASTRND = rnd; LASTPROF = prof; render(); }
    maybeAsk();
  } catch(e){ $('error').innerHTML = '<div class="errbox">' + esc(e.message) + '</div>'; }
}
function render(){
  if (!S) return;
  ({today:renderToday, ladders:renderLadders, review:renderReview, profile:renderProfile, progress:renderProgress, test:renderTest, control:renderControl}[TAB])();
}
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  TAB = b.dataset.tab;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('main > section').forEach(s => s.hidden = s.id !== 'tab-' + TAB);
  render();
});

/* ============================== задачи (сборка коллекций) ============================== */
async function startJob(path, body, title){
  try {
    const r = await api(path, body || {});
    JOB = r.id; JOBSEEN = 0; $('joblog').textContent = ''; $('jobtitle').textContent = title || 'Работаю…';
    $('jobpanel').hidden = false; $('jobstop').disabled = false;
    clearInterval(JOBTIMER); JOBTIMER = setInterval(pollJob, 800);
  } catch(e){ alert(e.message); }
}
async function pollJob(){
  if (!JOB) return;
  let d; try { d = await api('/api/job?id=' + encodeURIComponent(JOB) + '&from=' + JOBSEEN); } catch(e){ return; }
  if (d.lines && d.lines.length){ JOBSEEN = d.total; const l = $('joblog');
    l.textContent += (l.textContent ? '\n' : '') + d.lines.join('\n'); l.scrollTop = l.scrollHeight; }
  if (d.state === 'queued' || d.state === 'running') return;
  clearInterval(JOBTIMER); JOB = null; $('jobstop').disabled = true;
  $('jobtitle').textContent = d.state === 'done' ? 'Готово' : d.state === 'cancelled' ? 'Остановлено' : 'Ошибка: ' + (d.error || '');
  refresh(true);
}
async function stopJob(){ if (JOB) try { await api('/api/cancel', {id:JOB}); } catch(e){} }
async function post(path, body){ try { await api(path, body); await refresh(true); } catch(e){ alert(e.message); } }

/* ============================== «Сегодня» ============================== */
function thrText(t){ return 'Порог: ' + S.need + ' карты из ' + S.of + ' с точностью от ' + Math.round(t.acc * 100) + '% и не больше ' + t.misses + ' промахов — считается первая сохранённая попытка каждой карты.'; }
function mapsTable(maps, results, opts){
  opts = opts || {};
  return '<div class="tablewrap"><table><tr>' + (opts.slot ? '<th>Слот</th>' : '') + '<th>Карта</th><th class="num">★</th>' +
    (opts.value ? '<th class="num">' + esc(opts.value) + '</th>' : '') + '<th class="num">Результат</th></tr>' +
    maps.map(m => { const r = results && results[m.md5];
      const res = !r ? '<span class="muted">ещё нет</span>' :
        (opts.slot ? '' : (r.ok ? '<span class="badge ok">сдано</span> ' : '<span class="badge bad">мимо</span> ')) +
        pct(r.acc, 2) + ' · ' + r.misses + ' пр.' + (r.mods && r.mods.length ? ' ' + mods(r.mods) : '');
      return '<tr' + (r && r.id ? ' class="click" onclick="openPlay(\'' + r.id + '\')"' : '') + '>' +
        (opts.slot ? '<td><b>' + esc(m.slot) + '</b> ' + (m.mod && m.mod !== 'NM' && m.mod !== 'FM' && m.mod !== 'TB' ? '<span class="badge mod">' + esc(m.mod) + '</span>' : '') + '</td>' : '') +
        '<td>' + mapName(m) + ' <a href="https://osu.ppy.sh/b/' + (+m.bid) + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">↗</a> ' + codeChip(m) + '</td>' +
        '<td class="num">' + num(m.sr, 2) + '</td>' + (opts.value ? '<td class="num">' + esc(m.label || m.value || '') + '</td>' : '') +
        '<td class="num">' + res + '</td></tr>'; }).join('') + '</table></div>';
}
function trainingBlock(p){
  const tr = p.open;
  let h = '<h2>Тренировка: ' + esc(p.title) + ' <span class="badge acc">ступень ' + (p.step + 1) + '</span></h2>' +
    '<p><b>' + esc(p.label) + '</b></p><p class="muted">' + esc(thrText(p.threshold)) + '</p>';
  if (p.escape) h += escapeBox(p.ladder);
  if (tr){
    const res = tr.results || {}, ok = Object.values(res).filter(r => r.ok).length, played = Object.keys(res).length;
    h += '<p>Сыграно ' + played + ' из ' + tr.maps.length + ', сдано <b class="' + (ok >= S.need ? 'ok' : '') + '">' + ok + '</b> из ' + Math.min(S.need, tr.maps.length) + ' нужных. ' +
      'Коллекция в игре: <b>' + esc(tr.name) + '</b></p>';
    if (tr.warmup && tr.warmup.length) h += '<h3>Разминка — ступенью ниже, в зачёт не идёт</h3><p class="muted">Коллекция «' + esc(tr.warmup_name) + '»: ' +
      tr.warmup.map(m => esc(m.artist) + ' — ' + esc(m.title) + ' ' + codeChip(m)).join('; ') + '</p>';
    h += '<h3>Карты ступени</h3>' + mapsTable(tr.maps, res, {value:'параметр'});
    h += '<div class="actions"><button class="btn" onclick="finishTraining(\'' + tr.id + '\')">Закончить — несыгранные не в зачёт</button>' +
      '<button class="btn" onclick="buildTraining(\'' + p.ladder + '\')">Новая тренировка</button></div>';
  } else {
    h += '<p>Соберу 5 новых карт этой ступени (которые ты не играл неделю) и 3 карты разминки ступенью ниже — обе коллекции появятся в игре.</p>' +
      '<div class="actions"><button class="btn go" onclick="buildTraining(\'' + p.ladder + '\')">Собрать разминку и тренировку</button></div>';
  }
  return h;
}
function escapeBox(key){
  return '<div class="warnbox">Три тренировки подряд порог не взят. Так бывает: порог может быть высоковат или ступень слишком крутая. Что делаем?' +
    '<div class="actions"><button class="btn small" onclick="post(\'/api/coach/ladder\', {key:\'' + key + '\', escape:\'back\'})">Шаг назад</button>' +
    '<button class="btn small" onclick="post(\'/api/coach/ladder\', {key:\'' + key + '\', escape:\'soften\'})">Мягче порог (−2% точности, +1 промах)</button>' +
    '<button class="btn small" onclick="post(\'/api/coach/ladder\', {key:\'' + key + '\', escape:\'keep\'})">Продолжаю как есть</button></div></div>';
}
function buildTraining(key){ startJob('/api/coach/training', {ladder:key}, 'Собираю разминку и тренировку'); }
function finishTraining(id){ if (confirm('Закончить тренировку? Несыгранные карты не будут засчитаны.')) post('/api/coach/training/finish', {id}); }

// зачёт случайной карты в лестницу: строка для карточки и значок для истории
function creditLine(k){
  if (!k.counted) return esc(k.title) + ' — ' + (k.map_step < k.step ? 'карта ниже твоей ступени, не в зачёт' : 'карта выше твоей ступени, порог не взят — не в зачёт');
  if (k.up) return '<b class="ok">' + esc(k.title) + ': ступень ' + (k.step + 1) + ' сдана, теперь ступень ' + (k.step + 2) + '</b>';
  return '<b>' + esc(k.title) + '</b>, ступень ' + (k.step + 1) + ': ' + (k.ok ? '<span class="ok">порог взят</span>' : '<span class="bad">порог не взят</span>') +
    ' · на ступени ' + k.got + ' из ' + S.need + ' нужных (считаются последние ' + S.of + ' карт)';
}
function creditBadges(ks){
  return (ks || []).filter(k => k.counted).map(k => '<span class="badge ' + (k.ok ? 'ok' : 'bad') + '">' + esc(k.title) +
    (k.up ? ' ↑' + (k.step + 2) : k.ok ? ' +' : ' ✗') + '</span>').join(' ');
}
function randomCard(r){
  if (!r) return '';
  const opts = '<option value="any"' + (r.skill === 'any' ? ' selected' : '') + '>любой навык</option>' +
    '<option value="ladders"' + (r.skill === 'ladders' ? ' selected' : '') + '>навык моих лестниц</option>' +
    '<option value="farm"' + (r.skill === 'farm' ? ' selected' : '') + (r.farm_ready ? '' : ' disabled') + '>фарм-карты' +
      (r.farm_ready ? '' : ' (сначала отметь фарм)') + '</option>' +
    r.skills.map(s => '<option value="' + s.key + '"' + (r.skill === s.key ? ' selected' : '') + '>' + esc(s.title) + '</option>').join('');
  const c = r.current;
  let h = '<div class="card" style="grid-column:1/-1"><h2>Случайная карта' + (r.auto ? ' <span class="badge acc">идёт</span>' : '') + '</h2>';
  if (r.preparing) h += '<p class="warn">Готовлю следующую карту…</p>';
  else if (r.error) h += '<div class="errbox">' + esc(r.error) + '. Режим остановлен — нажми «Дай карту», чтобы попробовать снова.</div>';
  if (c && !c.result){
    h += '<p><b>' + mapName(c) + '</b> · ' + num(c.sr, 2) + '★ · <span class="badge acc">' + esc(c.skill_title) + '</span> ' +
      (c.farm ? '<span class="badge warn">фарм</span> ' : '') +
      '<a href="https://osu.ppy.sh/b/' + (+c.bid) + '" target="_blank" rel="noopener">↗</a></p>' +
      '<p>Код: ' + codeChip(c, true) + ' — нажми, чтобы скопировать, и вставь в поиск в выборе карты: lazer найдёт её по номеру. ' +
      'Если поиск пока пустой — lazer ещё импортирует карту, подожди пару секунд.</p>' +
      (c.ladder ? '<p>Ступень ' + (c.ladder_step + 1) + ' твоей лестницы <b>' + esc(c.ladder_title) + '</b> (' + esc(c.ladder_label) + '): возьмёшь порог — пойдёт в зачёт.</p>' : '') +
      '<p class="muted">' + esc(c.why) + '. Ещё она лежит в коллекции «' + esc(r.collection) + '» — там только эта карта. ' +
      'Сыграй её: результат появится здесь через несколько секунд после конца карты, и сразу будет следующая.</p>';
  } else if (c && c.result){
    const x = c.result;
    h += '<p>Сыграно: <b>' + mapName(c) + '</b> ' + mods(x.mods) + ' — <b>' + pct(x.acc, 2) + '</b> · ' + x.misses + ' пр.' +
      (x.weak && x.weak.length ? ' · слабее всего: ' + x.weak.map(esc).join(', ') : '') +
      ' · <a href="#" onclick="openPlay(\'' + x.id + '\');return false">разбор</a></p>' +
      (x.kind && x.kind.length ? '<p class="muted">Как сыграна' + (x.mods && x.mods.length ? ', с модами' : '') + ': ' + x.kind.map(esc).join(', ') + '</p>' : '') +
      (x.ladders && x.ladders.length ? '<ul class="plain">' + x.ladders.map(k => '<li>' + creditLine(k) + '</li>').join('') + '</ul>' : '') +
      (r.auto ? '' : '<p class="muted">Режим остановлен.</p>');
  } else {
    h += '<p>Дам одну новую карту случайного навыка около твоего уровня (~' + num(S.comfort, 2) + '★), которую ты не играл неделю. ' +
      'Сыграл — сразу следующая, и так сколько хочешь. Похожих на твои фарм-карты не будет — разве что выберешь «фарм-карты».</p>' +
      '<p class="muted">Если на навык есть твоя лестница, карта будет с твоей ступени. ' +
      'Карты идут в зачёт лестниц, как в тренировке: порог взят на ' + S.need + ' из последних ' + S.of + ' карт ступени — ступень сдана. ' +
      'Моды учитываются: с DT, HR или HD карта считается такой, какой ты её сыграл.</p>';
  }
  h += '<div class="actions"><select id="rndskill">' + opts + '</select>' +
    '<button class="btn go"' + (r.preparing ? ' disabled' : '') + ' onclick="startJob(\'/api/coach/random\', {action:\'next\', skill:$(\'rndskill\').value}, \'Ищу случайную карту\')">' +
    (c && !c.result ? 'Другую' : 'Дай карту') + '</button>' +
    (r.auto ? '<button class="btn" onclick="post(\'/api/coach/random\', {action:\'stop\'})">Стоп</button>' : '') + '</div>';
  if (r.history.length) h += '<h3>Последние сыгранные (' + r.played + ')</h3><div class="tablewrap"><table><tr><th>Карта</th><th>Как сыграна</th><th class="num">★</th><th class="num">Результат</th><th>Зачёт</th></tr>' +
    r.history.map(x => '<tr class="click" onclick="openPlay(\'' + x.result.id + '\')"><td>' + mapName(x) + ' ' + codeChip(x) + '</td>' +
      '<td class="muted">' + esc((x.result.kind && x.result.kind.length ? x.result.kind : [x.skill_title]).join(', ')) + ' ' + mods(x.result.mods) + '</td><td class="num">' + num(x.sr, 2) + '</td>' +
      '<td class="num">' + pct(x.result.acc, 2) + ' · ' + x.result.misses + ' пр.</td><td>' + (creditBadges(x.result.ladders) || '<span class="muted">—</span>') + '</td></tr>').join('') + '</table></div>';
  return h + '</div>';
}
function renderToday(){
  let h = '<div class="grid">' + randomCard(S.random);
  for (const p of S.plan){
    if (p.kind === 'test'){
      const t = S.tests[S.tests.length - 1];
      h += '<div class="card"><h2>Вступительный тест</h2>';
      if (p.status === 'none'){
        h += '<p>Настоящий пул турнира для 6-digit (RO32/RO16), с модами. Разбор покажет, где ты проседаешь сильнее всего — с этого начнутся лестницы.</p>' +
          '<div class="actions"><button class="btn go" onclick="startJob(\'/api/coach/test\', {}, \'Собираю тест\')">Собрать тест</button></div>';
      } else {
        h += '<p><b>' + esc(t.tournament) + ' ' + esc(t.edition) + ' · ' + esc(t.round) + '</b> — сыграно ' + p.played + ' из ' + p.total + '. ' +
          'Играй с модом слота: HD — с HD, HR — с HR, DT — с DT; NM и TB — без модов.</p>' +
          '<div class="actions"><button class="btn" onclick="switchTab(\'test\')">Карты теста</button>' +
          '<button class="btn go" ' + (p.played >= 3 ? '' : 'disabled') + ' onclick="post(\'/api/coach/test/finish\', {id:\'' + t.id + '\'})">Подвести итог</button></div>';
      }
      h += '</div>';
    } else if (p.kind === 'training'){
      h += '<div class="card">' + trainingBlock(p) + '</div>';
    } else if (p.kind === 'focus'){
      h += '<div class="card"><h2>Слабое место недели</h2><p><b>' + esc(p.name) + '</b> — ' + esc(p.text) + '.</p>' +
        '<p class="muted">По ' + p.plays + ' попыткам за ' + p.days + ' дней, соло и мультиплеер. Сложность карт учтена: паттерн сравнивается с остальной картой.</p>' +
        (p.is_active ? '<p class="ok">Твоя основная лестница — как раз про это.</p>'
          : '<div class="actions"><button class="btn go" onclick="post(\'/api/coach/ladder\', {key:\'' + p.ladder + '\'})">Качать: ' + esc(p.ladder_title) + '</button>' +
            '<button class="btn" onclick="switchTab(\'profile\')">Профиль</button></div>') + '</div>';
    } else if (p.kind === 'free'){
      const s = S.sessions[0];
      h += '<div class="card"><h2>Свободная игра</h2><p>Играй что хочешь — соло или мультиплеер: каждая попытка разбирается сама, как только lazer её сохранит.</p>' +
        (p.habits && p.habits.length ? '<ul class="plain">' + p.habits.map(l => '<li>' + esc(l) + '</li>').join('') + '</ul>' : '') +
        (s ? '<p class="muted">Последняя сессия: ' + dt(s.start) + ', карт: ' + s.plays + ', точность ' + pct(s.acc) +
          (s.weak.length ? ', слабое место — ' + esc(s.weak[0]) : '') + '</p><div class="actions"><button class="btn" onclick="openSession(\'' + s.id + '\')">Разбор сессии</button></div>' : '') + '</div>';
    } else if (p.kind === 'control'){
      h += '<div class="card"><h2>Контрольный день</h2>' +
        (p.maps ? '<p>' + (p.due ? '<b class="warn">Пора</b> — сыграй контрольные карты и сравни себя со старым собой.' :
          'Следующий через ' + p.days_left + ' дн.') + ' Контрольных карт: ' + p.maps + '.</p>' +
          '<div class="actions"><button class="btn ' + (p.due ? 'go' : '') + '" onclick="startJob(\'/api/coach/controlday\', {}, \'Собираю контрольные карты\')">Собрать контрольные карты</button></div>'
          : '<p>Добавь карты «старого себя» — закреплённые скоры и карты, которые сейчас не можешь побить.</p><div class="actions"><button class="btn" onclick="switchTab(\'control\')">Добавить</button></div>') + '</div>';
    }
  }
  if (!S.active){
    h += '<div class="card"><h2>Лестница</h2><p>Лестницу подберёт вступительный тест. Можно начать и сразу — выбери навык:</p>' + ladderPicker() + '</div>';
  }
  h += '</div>';
  if (S.recent.length){
    h += '<div class="card"><h2>Последние попытки</h2>' + playsTable(S.recent.slice(0, 10)) + '</div>';
  }
  $('tab-today').innerHTML = h;
}
function switchTab(t){ document.querySelector('#tabs button[data-tab="' + t + '"]').click(); }
function ladderPicker(){
  const have = new Set(S.ladders.map(l => l.key));
  const opts = S.ladder_defs.filter(d => !have.has(d.key)).map(d => '<option value="' + d.key + '">' + esc(d.title) + '</option>').join('');
  return opts ? '<div class="actions"><select id="ladsel">' + opts + '</select><button class="btn" onclick="post(\'/api/coach/ladder\', {key:$(\'ladsel\').value})">Добавить лестницу</button></div>' : '';
}
function playsTable(rows){
  return '<div class="tablewrap"><table><tr><th>Когда</th><th>Карта</th><th>Тип</th><th class="num">★</th><th class="num">Точность</th><th class="num">Промахи</th><th class="num">UR</th><th>Слабее всего</th></tr>' +
    rows.map(r => '<tr class="click" onclick="openPlay(\'' + r.id + '\')"><td class="num">' + dt(r.ts) + '</td><td>' + mapName(r) + ' ' + mods(r.mods) + '</td>' +
      '<td class="muted">' + (r.kind || []).map(esc).join(', ') + '</td>' +
      '<td class="num">' + num(r.sr, 2) + '</td><td class="num">' + pct(r.acc, 2) + ' <span class="muted">' + (RANK[r.rank] || '') + '</span></td>' +
      '<td class="num">' + r.misses + (r.breaks ? ' <span class="muted">+' + r.breaks + ' sb</span>' : '') + '</td><td class="num">' + num(r.ur) + '</td>' +
      '<td class="muted">' + (r.weak || []).map(tagName).map(esc).join(', ') + '</td></tr>').join('') + '</table></div>';
}

/* ============================== «Лестницы» ============================== */
function renderLadders(){
  let h = '';
  if (!S.ladders.length) h += '<div class="card"><p>Лестниц пока нет. Их заведёт вступительный тест — или добавь сам.</p>' + ladderPicker() + '</div>';
  for (const l of S.ladders){
    h += '<div class="card"><h2>' + esc(l.title) + (l.mod ? ' <span class="badge mod">' + esc(l.mod) + '</span>' : '') +
      (l.active ? ' <span class="badge acc">основная</span>' : '') + '</h2>';
    h += '<div class="steps">' + l.steps.map((s, i) => '<span class="step ' + (i < l.step ? 'done' : i === l.step ? 'cur' : 'lock') + '">' +
      (i < l.step ? '✓ ' : i > l.step ? '🔒 ' : '') + esc(s) + '</span>').join('') + '</div>';
    h += '<p class="muted">' + esc(thrText(l.threshold)) + (l.fails_in_row ? ' Не сдано подряд: ' + l.fails_in_row + '.' : '') + '</p>';
    const rw = l.random.window;
    h += rw.length ? '<p>Случайные карты на этой ступени: ' + rw.map(x => '<span class="' + (x.ok ? 'ok' : 'bad') + '" title="' + esc(x.title + ' [' + x.diff + '] · ' + x.value) + '">' + (x.ok ? '✓' : '✗') + '</span>').join(' ') +
        ' — порог взят на <b class="' + (l.random.ok >= S.need ? 'ok' : '') + '">' + l.random.ok + '</b> из ' + S.need + ' нужных (считаются последние ' + S.of + ').</p>'
      : '<p class="muted">Случайные карты этой ступени тоже идут в зачёт: порог на ' + S.need + ' из последних ' + S.of + ' — ступень сдана.</p>';
    if (l.random.ups) h += '<p class="muted">Ступеней сдано случайными картами: ' + l.random.ups + '.</p>';
    if (l.free && l.free.n) h += '<p>Вне тренировок и случайных карт (соло и мульти, ' + l.free.days + ' дней) на этой ступени: ' + l.free.n + ' карт, порог взят на ' + l.free.ok +
      ', средняя точность ' + pct(l.free.acc) + '. <span class="muted">В зачёт ступени не идёт — только показывает, как ты тянешь её в обычной игре.</span></p>';
    if (l.escape) h += escapeBox(l.key);
    if (l.history.length){
      h += '<h3>Тренировки</h3><div class="tablewrap"><table><tr><th>Когда</th><th>Ступень</th><th>Итог</th><th class="num">Сдано</th><th class="num">Точность</th><th class="num">Промахи</th><th class="num">UR</th></tr>' +
        l.history.slice().reverse().map(t => '<tr><td>' + dt(t.created) + '</td><td>' + (t.step + 1) + ' · ' + esc(l.steps[t.step]) + '</td><td>' +
          ({open:'<span class="badge warn">идёт</span>', passed:'<span class="badge ok">сдана</span>', failed:'<span class="badge bad">не сдана</span>', abandoned:'<span class="badge">брошена</span>'}[t.status] || t.status) +
          '</td><td class="num">' + t.ok + ' / ' + t.played + ' из ' + t.total + '</td><td class="num">' + pct(t.acc) + '</td><td class="num">' + num(t.misses, 1) + '</td><td class="num">' + num(t.ur) + '</td></tr>').join('') +
        '</table></div>';
    }
    h += '<div class="actions">' + (l.active ? '' : '<button class="btn" onclick="post(\'/api/coach/ladder\', {key:\'' + l.key + '\'})">Сделать основной</button>') +
      '<button class="btn go" onclick="buildTraining(\'' + l.key + '\')">' + (l.open ? 'Новая тренировка' : 'Собрать тренировку') + '</button></div></div>';
  }
  if (S.ladders.length) h += '<div class="card"><h2>Ещё лестница</h2><p class="muted">Лестницы с модами (DT, HR, HD) обычно заводит тест, когда видит просадку именно с модом.</p>' + ladderPicker() + '</div>';
  $('tab-ladders').innerHTML = h;
}

/* ============================== «Разборы» ============================== */
function openSession(id){ SESSION = id; switchTab('review'); }
async function renderReview(){
  const list = S.sessions;
  if (!list.length){ $('tab-review').innerHTML = '<div class="card"><p>Попыток пока нет — сыграй пару карт в osu!lazer, разбор появится здесь сам.</p></div>'; return; }
  if (!SESSION || !list.some(s => s.id === SESSION)) SESSION = list[0].id;
  let left = list.map(s => '<div class="sess' + (s.id === SESSION ? ' on' : '') + '" onclick="SESSION=\'' + s.id + '\';renderReview()">' +
    '<b>' + dt(s.start) + '</b> <span class="muted">· ' + s.plays + ' карт · ' + pct(s.acc) + ' · UR ' + num(s.ur) + '</span>' +
    (s.weak.length ? '<div class="muted">слабее всего: ' + s.weak.map(esc).join(', ') + '</div>' : '') + '</div>').join('');
  $('tab-review').innerHTML = '<div class="split"><div>' + left + '</div><div id="sessdetail"><div class="card"><p class="muted">загружаю…</p></div></div></div>';
  try {
    const v = await api('/api/coach/session?id=' + encodeURIComponent(SESSION));
    $('sessdetail').innerHTML = sessionDetail(v);
  } catch(e){ $('sessdetail').innerHTML = '<div class="errbox">' + esc(e.message) + '</div>'; }
}
function causesBar(c){
  const tot = c.skip + c.aim + c.timing + c.noclick;
  if (!tot) return '<p class="muted">Промахов нет.</p>';
  const seg = [['skip', '#ff6b6b', 'пропуск ноты (сбился в потоке)'], ['aim', '#ffcc66', 'мимо круга'], ['timing', '#66ccff', 'рано или поздно'], ['noclick', '#7d6c75', 'не нажал']];
  return '<div class="causes">' + seg.map(([k, col]) => c[k] ? '<div style="width:' + (100 * c[k] / tot) + '%;background:' + col + '"></div>' : '').join('') + '</div>' +
    '<div class="legend">' + seg.filter(([k]) => c[k]).map(([k, col, name]) => '<span><i style="background:' + col + '"></i>' + name + ': ' + c[k] + '</span>').join('') + '</div>';
}
function weakList(wk){
  return wk.length ? wk.map(w => '<div class="weak"><b>' + esc(w.name) + '</b><span>' + esc(w.text) + ' · нот: ' + w.n + '</span></div>').join('')
    : '<p class="muted">Явных слабых мест не видно — ошибки распределены ровно.</p>';
}
function sessionDetail(v){
  const a = v.agg;
  let h = '<div class="card"><h2>Сессия ' + dt(v.start) + ' — ' + v.plays.length + ' карт</h2>' +
    '<div class="kpis"><div class="kpi"><div class="v">' + pct(v.plays.reduce((s, p) => s + p.acc, 0) / v.plays.length) + '</div><div class="l">средняя точность</div></div>' +
    '<div class="kpi"><div class="v">' + v.plays.reduce((s, p) => s + p.misses, 0) + '</div><div class="l">промахов</div></div>' +
    '<div class="kpi"><div class="v">' + num(a.ur) + '</div><div class="l">UR (медиана)</div></div>' +
    '<div class="kpi"><div class="v">' + (a.mean == null ? '—' : (a.mean > 0 ? '+' : '') + num(a.mean, 1)) + '</div><div class="l">сдвиг нажатий, мс</div></div></div>';
  if (v.fatigue) h += '<p class="muted">Первая треть сессии — ' + pct(v.fatigue.first) + ', последняя — ' + pct(v.fatigue.last) + '.</p>';
  h += '<h3>Где ошибаешься</h3>' + weakList(v.weak);
  if (v.insights.length) h += '<h3>Наблюдения</h3><ul class="plain">' + v.insights.map(l => '<li>' + esc(l) + '</li>').join('') + '</ul>';
  h += '<h3>Причины промахов</h3>' + causesBar(a.causes);
  if (v.advice.length) h += '<h3>Что качать</h3><div class="actions">' + v.advice.map(x => '<button class="btn" onclick="post(\'/api/coach/ladder\', {key:\'' + x.ladder + '\'}).then(() => switchTab(\'today\'))">' +
    esc(x.title) + ' <span class="muted">(' + esc(x.because) + ')</span></button>').join('') + '</div>';
  h += '<h3>Паттерны</h3>' + tagTable(a.tags, a.rate) + '</div>';
  h += '<div class="card"><h2>Карты сессии</h2>' + playsTable(v.plays.slice().reverse()) + '</div>';
  return h;
}
function tagTable(tags, base){
  const rows = tags.filter(t => t.n >= 5);
  if (!rows.length) return '<p class="muted">Мало данных.</p>';
  return '<div class="tablewrap"><table><tr><th>Паттерн</th><th class="num">Нот</th><th class="num">Ошибок</th><th class="num">× к среднему</th><th class="num">Промахи</th><th class="num">Сдвиг, мс</th></tr>' +
    rows.map(t => '<tr><td>' + esc(t.name) + '</td><td class="num">' + t.n + '</td><td class="num">' + pct(t.rate) + '</td><td class="num ' +
      (t.ratio >= 1.3 ? 'bad' : t.ratio <= 0.8 ? 'ok' : '') + '">' + num(t.ratio, 2) + '</td><td class="num">' + t.miss + '</td><td class="num">' +
      (t.mean == null ? '—' : (t.mean > 0 ? '+' : '') + num(t.mean, 1)) + '</td></tr>').join('') + '</table></div>' +
    '<p class="muted">«Ошибок» — промахи и неточные нажатия (100 и 50) с весами; «× к среднему» — во сколько раз больше, чем по всем нотам (' + pct(base) + '). Минус в сдвиге — нажимаешь раньше.</p>';

function closeAsk(){ if (ASK) ASKCLOSED = ASK.id; $('askmodal').classList.remove('open'); }

    '<div class="chips">' + v.scores.map(x => '<button class="chip' + (ASKSEL.has(x.key) ? ' on' : '') + '" title="' + esc(x.why + (x.like ? ' · поправлено по твоей отметке «' + x.like + '»' : '')) +

  if (v.insights.length) h += '<h3>Наблюдения</h3><ul class="plain">' + v.insights.map(l => '<li>' + esc(l) + '</li>').join('') + '</ul>';
  h += '<h3>Причины промахов</h3>' + causesBar(sm.causes);
  const aim = a.aim || {};
  if (aim.jumps) h += '<h3>Прицел</h3><p class="muted">Прыжков: ' + aim.jumps + '. Нажатий с перелётом — ' + pct(aim.jump_over, 0) + ', с недолётом — ' + pct(aim.jump_under, 0) +
    '. Обычно ты попадаешь на ' + num(aim.hit_r * 100) + '% радиуса от центра' + (aim.miss_r ? '; промахи мимо круга — в среднем ' + num(aim.miss_r, 2) + ' радиуса от центра' : '') + '.</p>';
  const tags = Object.entries(a.tags).map(([k, t]) => ({tag:k, name:tagName(k), n:t.n, rate:t.err, ratio:sm.err ? t.err / sm.err : null, miss:t.miss, mean:t.mean}))
    .sort((x, y) => (y.ratio || 0) - (x.ratio || 0));

  return h;

function skillsetBlock(ss, id){

  if (ss.burst_ratio >= 0.05) facts.push('bursts ' + pct(ss.burst_ratio, 0) + ' нот, ' + num(ss.burst_bpm) + ' BPM');

  if (ss.fits.length) h += '<ul class="plain">' + ss.fits.map(f => '<li><b>' + esc(f.title) + '</b>: ступень ' + (f.step + 1) + ' — ' + esc(f.label) + ' (у карты ' + esc(f.value) + ')' +
    (f.yours == null ? '' : f.yours === f.step ? ' — <span class="ok">как раз твоя ступень</span>' : f.step > f.yours ? ' — <span class="warn">выше твоей ступени ' + (f.yours + 1) + '</span>' : ' — ниже твоей ступени ' + (f.yours + 1)) + '</li>').join('') + '</ul>';

function timeline(a){
  const T = a.timeline; if (!T.length) return '';
  const W = 1000, H = 190, t0 = T[0][0], t1 = T[T.length - 1][0], span = Math.max(1, t1 - t0);
  const X = t => 10 + (t - t0) / span * (W - 20);
  const lim = Math.max(20, Math.min(160, Math.ceil(a.info.great_ms / (a.info.rate || 1) * 3)));
  const Y = o => 70 - Math.max(-1, Math.min(1, o / lim)) * 60;
  const col = ['var(--c-great)', 'var(--c-ok)', 'var(--c-meh)', 'var(--c-miss)'];
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block;margin:10px 0">';
  for (const w of a.worst) s += '<rect x="' + X(w.t * 1000) + '" y="4" width="' + Math.max(3, X(w.until * 1000) - X(w.t * 1000)) + '" height="140" fill="#ff66aa22"/>';
  s += '<line x1="10" x2="' + (W - 10) + '" y1="70" y2="70" stroke="var(--line2)"/>';
  s += '<text x="12" y="16">раньше −' + lim + ' мс</text><text x="12" y="138">позже +' + lim + ' мс</text>';
  for (const p of T){ if (p[2] != null && p[1] < 3) s += '<circle cx="' + X(p[0]).toFixed(1) + '" cy="' + Y(-p[2]).toFixed(1) + '" r="1.7" fill="' + col[p[1]] + '" opacity=".8"/>'; }
  for (const p of T){ if (p[1] === 3) s += '<line x1="' + X(p[0]).toFixed(1) + '" x2="' + X(p[0]).toFixed(1) + '" y1="8" y2="132" stroke="var(--c-miss)" stroke-width="1.2" opacity=".75"/>'; }
  const secW = (W - 20) / 10;
  a.sections.forEach((sec, i) => { if (!sec.n) return; const e = Math.min(1, sec.err / 0.3);
    s += '<rect x="' + (10 + i * secW + 1) + '" y="150" width="' + (secW - 2) + '" height="14" rx="3" fill="rgb(255,' + Math.round(200 - 140 * e) + ',' + Math.round(170 - 110 * e) + ')" opacity="' + (0.25 + 0.75 * e) + '"/>'; });
  for (let k = 0; k <= 4; k++){ const t = t0 + span * k / 4; s += '<text x="' + Math.min(W - 40, X(t) - 12) + '" y="182">' + mmss(t / 1000) + '</text>'; }
  s += '</svg><div class="legend"><span><i style="background:var(--c-great)"></i>300</span><span><i style="background:var(--c-ok)"></i>100</span>' +
    '<span><i style="background:var(--c-meh)"></i>50</span><span><i style="background:var(--c-miss)"></i>промах</span><span><i style="background:#ff66aa55"></i>худшие места</span>' +
    '<span>полоса снизу — ошибки по десятым долям карты</span></div>';
  return s;
}

/* ============================== «Прогресс» ============================== */
function chart(series, opts){
  opts = opts || {};
  const W = 1000, H = 220, P = 36;
  const pts = series.flatMap(s => s.points);
  if (pts.length < 2) return '<p class="muted">Пока мало данных для графика.</p>';
  const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = opts.y0 != null ? opts.y0 : Math.min(...ys), y1 = opts.y1 != null ? opts.y1 : Math.max(...ys);
  if (x1 === x0) x1 = x0 + 1; if (y1 === y0){ y1 += 1; y0 -= 1; }
  const pad = (y1 - y0) * 0.08; y0 -= pad; y1 += pad;
  const X = x => P + (x - x0) / (x1 - x0) * (W - P - 10), Y = y => H - 24 - (y - y0) / (y1 - y0) * (H - 40);
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">';
  for (let k = 0; k <= 4; k++){ const y = y0 + (y1 - y0) * k / 4; s += '<line x1="' + P + '" x2="' + (W - 10) + '" y1="' + Y(y) + '" y2="' + Y(y) + '" stroke="var(--line)"/>' +
    '<text x="2" y="' + (Y(y) + 4) + '">' + (opts.fmt ? opts.fmt(y) : y.toFixed(0)) + '</text>'; }
  for (const se of series){
    if (!se.points.length) continue;
    s += '<polyline fill="none" stroke="' + se.color + '" stroke-width="2" points="' + se.points.map(p => X(p[0]).toFixed(1) + ',' + Y(p[1]).toFixed(1)).join(' ') + '"/>';
    for (const p of se.points) s += '<circle cx="' + X(p[0]).toFixed(1) + '" cy="' + Y(p[1]).toFixed(1) + '" r="3" fill="' + se.color + '"><title>' + esc(se.name) + ': ' + (opts.fmt ? opts.fmt(p[1]) : p[1]) + (p[2] ? ' · ' + esc(p[2]) : '') + '</title></circle>';
  }
  const lab = opts.labels || [new Date(x0 * 1000), new Date(x1 * 1000)].map(d => d.toLocaleDateString('ru', {day:'numeric', month:'short'}));
  s += '<text x="' + P + '" y="' + (H - 4) + '">' + esc(lab[0]) + '</text>' +
    '<text x="' + (W - 110) + '" y="' + (H - 4) + '">' + esc(lab[1]) + '</text></svg>';
  s += '<div class="legend">' + series.map(se => '<span><i style="background:' + se.color + '"></i>' + esc(se.name) + '</span>').join('') + '</div>';
  return s;
}
async function renderProgress(){
  $('tab-progress').innerHTML = '<div class="card"><p class="muted">загружаю…</p></div>';
  let v; try { v = await api('/api/coach/progress'); } catch(e){ $('tab-progress').innerHTML = '<div class="errbox">' + esc(e.message) + '</div>'; return; }
  let h = '<div class="grid">';
  const ss = v.sessions, sl = ss.length ? [dt(ss[0].start), dt(ss[ss.length - 1].start)] : null;
  h += '<div class="card"><h2>Сессии: точность</h2>' + chart([{name:'средняя точность', color:'#ff66aa', points:ss.map((s, i) => [i, s.acc * 100, dt(s.start) + ', ' + s.plays + ' карт'])}],
    {fmt:y => y.toFixed(1) + '%', labels:sl}) + '<p class="muted">Точки — сессии по порядку, последние 30.</p></div>';
  h += '<div class="card"><h2>Сессии: разброс нажатий (UR)</h2>' + chart([{name:'UR', color:'#66ccff', points:ss.map((s, i) => [i, s.ur, dt(s.start)]).filter(p => p[1])}], {labels:sl}) +
    '<p class="muted">Чем ниже UR, тем ровнее ты попадаешь в ритм.</p></div>';
  for (const l of v.ladders){
    const hist = l.history.filter(t => t.acc != null);
    h += '<div class="card"><h2>' + esc(l.title) + ' — ступень ' + (l.step + 1) + ' из ' + l.steps.length + '</h2>' +
      '<div class="steps">' + l.steps.map((s, i) => '<span class="step ' + (i < l.step ? 'done' : i === l.step ? 'cur' : 'lock') + '">' + esc(s) + '</span>').join('') + '</div>' +
      chart([{name:'точность на тренировках', color:'#ff66aa', points:hist.map((t, i) => [i, t.acc * 100, dt(t.created) + ', ступень ' + (t.step + 1)])}],
        {fmt:y => y.toFixed(1) + '%', labels:hist.length ? [dt(hist[0].created), dt(hist[hist.length - 1].created)] : null}) +
      (l.start != null && l.step > l.start ? '<p class="ok">С начала: +' + (l.step - l.start) + ' ступ.</p>' : '') + '</div>';
  }
  const c = v.control;
  if (c.maps.length){
    h += '<div class="card"><h2>Старый ты против нынешнего</h2>' + (c.gap != null ? '<p>Средний разрыв по контрольным картам: <b class="' + (c.gap >= 0 ? 'ok' : 'bad') + '">' +
      (c.gap >= 0 ? '+' : '') + (c.gap * 100).toFixed(2) + '%</b> точности.</p>' : '<p class="muted">Сыграй контрольный день — появится сравнение.</p>') + controlTable(c.maps) + '</div>';
  }
  h += '</div>';
  $('tab-progress').innerHTML = h;
}

function renderTest(){
  let h = '';

    h += '<div class="card"><h2>' + (last ? 'Новый тест' : 'Вступительный тест') + '</h2><p>Настоящий пул RO32/RO16 свежего турнира для 6-digit, с модами. ' +
      (last ? 'Повторять раз в месяц на новом пуле — видно, сместилась ли слабость.' : 'Разбор покажет, где ты проседаешь сильнее всего, и заведёт лестницы.') + '</p>' +
      '<div class="actions"><button class="btn go" onclick="startJob(\'/api/coach/test\', {}, \'Собираю тест\')">Собрать тест</button></div></div>';
  }
  for (const t of tests){
    h += '<div class="card"><h2>' + esc(t.tournament) + ' ' + esc(t.edition) + ' · ' + esc(t.round) + ' <span class="badge ' + (t.status === 'done' ? 'ok' : 'warn') + '">' +
      (t.status === 'done' ? 'итог подведён' : 'идёт') + '</span></h2><p class="muted">Собран ' + dt(t.created) + '. Коллекция «' + esc(t.name) + '». ' +
      'Играй с модом слота; в зачёт идёт первая попытка.</p>' + mapsTable(t.maps, t.results, {slot:true});
    if (t.status !== 'done') h += '<div class="actions"><button class="btn go" ' + (Object.keys(t.results).length >= 3 ? '' : 'disabled') +
      ' onclick="post(\'/api/coach/test/finish\', {id:\'' + t.id + '\'})">Подвести итог</button><span class="muted">Можно, когда сыграно хотя бы 3 карты; лучше — 70% пула.</span></div>';
    if (t.diagnosis){
      const d = t.diagnosis;
      h += '<h3>Итог</h3>' + (d.reasons.length ? '<ul class="plain">' + d.reasons.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>' : '') + weakList(d.weak);
      if (d.insights.length) h += '<ul class="plain">' + d.insights.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>';
      const mg = Object.entries(d.mods);
      if (mg.length) h += '<p class="muted">Точность по модам: ' + mg.map(([k, x]) => esc(k) + ' — ' + pct(x)).join(', ') + '.</p>';
      if (d.ladders.length) h += '<div class="actions">' + d.ladders.map(k => { const def = S.ladder_defs.find(x => x.key === k);
        return '<button class="btn" onclick="post(\'/api/coach/ladder\', {key:\'' + k + '\'}).then(() => switchTab(\'today\'))">Качать: ' + esc(def ? def.title : k) + '</button>'; }).join('') + '</div>';
    }
    h += '</div>';
  }
  $('tab-test').innerHTML = h;
}

/* лучшие скоры из всего профиля osu! (coach.rank_profile) */

function profileCard(pr){
  const run = pr.run;
  let h = '<div class="card"><h2>Лучшие скоры из профиля osu!' + (pr.user ? ' <span class="badge">' + esc(pr.user) + '</span>' : '') + '</h2>' +

    'pp не считаются, поэтому здесь есть и loved-карты. Фарм скрыт — это карты, которые игроки собирают в подборки «farm» и «pp» на osu!Collector. ' +
    'Если карта попала не туда, поправь кнопкой — твоя отметка важнее.</p>';

  if (!pr.ts) return h + '<div class="actions">' + again + '<span class="muted">Первый раз — около полутора часов: osu! отдаёт результаты по одной карте за запрос и просит не больше 60 запросов в минуту. Потом — только новые и переигранные карты.</span></div></div>';
  PSEL = new Set([...PSEL].filter(b => pr.items.some(m => m.bid === b && !m.taken)));
  h += '<p class="muted">Проверено карт: ' + pr.checked + ' из ' + pr.played + ', результатов: ' + pr.scores + '. Список собран ' + dt(pr.ts) + '.</p>' +
    '<div class="tablewrap"><table><tr><th></th><th>Карта</th><th class="num">★</th><th class="num">Скор</th><th class="num">pp</th><th class="num">Когда</th><th></th></tr>' +

  return h + '</div>';
}
function pickProfile(bid, on){

    '<p>Чтобы тренер сам взял «старого тебя» из профиля (закреплённые скоры и старые результаты на картах, которые ты сейчас играешь), нужен доступ к API osu!. Это 2 минуты:</p>' +
    '<ol class="plain"><li>Открой <a href="https://osu.ppy.sh/home/account/edit#oauth" target="_blank" rel="noopener">настройки аккаунта osu! → OAuth</a> и нажми «Новое OAuth-приложение».</li>' +
    '<li>Название любое, например «osu!drill»; адрес для возврата (callback) можно оставить пустым.</li>' +
    '<li>Скопируй сюда Client ID и Client Secret. Ключи хранятся только на этом компьютере (config.json), тренер только читает публичные данные профиля.</li></ol>' + form + '</div>';
  return '<div class="card"><h2>Профиль osu!' + (api.user ? ' — ' + esc(api.user) : '') + '</h2><p class="muted">Ключи API сохранены.' +
    (api.checked ? ' Последняя проверка старых результатов: ' + dt(api.checked) + '.' : '') + '</p>' +
    '<div class="actions"><button class="btn go" onclick="startJob(\'/api/coach/pinned\', {}, \'Беру закреплённые скоры\')">Подтянуть закреплённые скоры</button>' +
    '<button class="btn" onclick="startJob(\'/api/coach/unbeaten\', {}, \'Ищу, где старый ты сильнее\')">Найти карты, где старый ты сильнее</button>' +
    '<button class="btn" onclick="this.parentNode.nextElementSibling.hidden = false">Сменить ключи</button></div><div hidden>' + form + '</div></div>';
}
async function saveKeys(){
  try { await api('/api/coach/apikeys', {client_id:$('apiid').value, client_secret:$('apisecret').value, user:$('apiuser').value}); await refresh(true); }
  catch(e){ alert(e.message); }
}
function addControl(){ const text = $('ctltext').value.trim(); if (!text) return; startJob('/api/coach/control/add', {text}, 'Добавляю контрольные карты'); }
function addControlIds(bid){ startJob('/api/coach/control/add', {text:String(bid)}, 'Добавляю контрольную карту'); }

refresh();
setInterval(() => { if (!document.hidden && !JOB) refresh(); }, 10000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && !JOB) refresh(); });
</script>
